# Demo deploy of the exampleSite on Netlify.
# The symlink injects the theme (repo root) into exampleSite/themes/terminal-mono,
# so it works regardless of the cloned directory name.
[build]
  publish = "exampleSite/public"
  command = "mkdir -p exampleSite/themes && ln -sfn \"$PWD\" exampleSite/themes/terminal-mono && hugo --source exampleSite --gc --minify -b \"$DEPLOY_PRIME_URL\""

[build.environment]
  # Keep in sync with .github/workflows/ci.yml and pages.yml.
  HUGO_VERSION = "0.163.3"
  HUGO_ENV = "production"

[context.production.environment]
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"

# The CSS and the JS carry a SHA-256 of their own contents in the filename, and
# the fonts carry the version of the font — so all three are immutable by
# construction and a new build simply asks for a different URL. Netlify's
# default for them is `max-age=600`, which Lighthouse measured at an 8% cache
# hit probability: a reader who comes back an hour later re-downloads both
# fingerprinted assets to arrive at bytes they already had.
#
# This block is the demo's own deploy config, so it does nothing for a site
# built on this theme. The README documents the equivalent for GitHub Pages
# (which cannot set headers at all), Cloudflare Pages, Vercel and nginx,
# because a consumer has no way to know from the outside that the theme
# fingerprints its assets and that these paths can be cached forever.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
