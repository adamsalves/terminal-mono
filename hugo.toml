# Theme-level configuration, merged into the site's own.
#
# One thing lives here: a second, read-only view of the theme's own i18n/ under
# data/, so t.html can reach the theme's English strings even on a site that
# ships an i18n/en.toml of its own.
#
# The i18n lookup merges site over theme key by key, but Hugo's union filesystem
# does not: os.ReadFile "i18n/en.toml" returns the *first* match, so a site with
# a one-key i18n/en.toml used to leave a one-key fallback table behind and the
# other 48 labels rendered blank — the bug the fallback exists to prevent. Data
# files are keyed by mount target, and no site mounts anything at
# data/terminal_mono_i18n, so this view is the theme's alone. Hugo parses it, so
# nothing here has to guess a file format either.
#
# Declaring any mount replaces the default mounts for *every* component, not
# just the one declared — hence the five defaults spelled out below. Add a
# component directory to the theme and it needs a line here; ci.yml asserts that.
[module]
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  # The extra view. Same source, second target.
  [[module.mounts]]
    source = "i18n"
    target = "data/terminal_mono_i18n"

# ── AEO output formats ──────────────────────────────────────────────────────
# llms.txt is an index an answer engine can read in one request instead of
# crawling: title, description, and every page as a linked list. llms-full.txt
# is the content behind those links, in markdown, in one file. The per-page
# Markdown output is the same content addressed the way a citation would want
# it — /blogs/foo/index.md next to /blogs/foo/.
#
# All three are Hugo output formats, which is what keeps this a template change
# rather than a dependency: the aeo.js package that generates these elsewhere is
# 6.5MB of npm and has no Hugo integration, and its widget injects third-party
# JS into a theme whose README promises none.
#
# notAlternative on all three: head.html renders a <link rel=alternate> for
# every AlternativeOutputFormats entry, which is right for the RSS feed and
# wrong for a plain-text index — it would advertise llms.txt to feed readers.
[outputFormats]
  [outputFormats.LLMS]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true
  [outputFormats.LLMSFULL]
    mediaType = "text/plain"
    baseName = "llms-full"
    isPlainText = true
    notAlternative = true
  [outputFormats.MARKDOWN]
    mediaType = "text/markdown"
    baseName = "index"
    isPlainText = true
    notAlternative = true

# HTML and RSS are the defaults for home, and naming any of them replaces the
# whole list — so the feed has to be restated here or it stops being generated.
#
# This block is what the theme's own exampleSite builds against. A consuming
# site writes its own: Hugo's default merge does not bring a theme's [outputs]
# across. The exception is a site with `_merge = "deep"`, which does inherit
# this and starts publishing the three formats without having asked — documented
# in the README under AEO, and asserted in CI, because the earlier claim that it
# never merged was simply wrong.
[outputs]
  home = ["HTML", "RSS", "LLMS", "LLMSFULL"]
  page = ["HTML", "MARKDOWN"]
