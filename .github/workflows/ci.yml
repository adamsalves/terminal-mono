# Builds the bundled exampleSite on every pull request, so a broken template
# never reaches main — where pages.yml deploys the demo automatically.
# Deliberately kept separate from pages.yml: a PR check needs none of the Pages
# machinery (configure-pages, the pages concurrency group, pages:write).
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Successive pushes to the same PR supersede each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # The release tooling merges to main and pushes tags, so its logic is gated
  # here rather than discovered during a release. The suite reads the real
  # CHANGELOG.md, which means the release PR — whose only change is that file —
  # validates its own promoted changelog before it can merge.
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test the release tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      # The Hugo build only proves data-posts was rendered. Everything the reader
      # sees in the hero terminal is built by terminal.js, and a build stays green
      # with the listing completely broken — so the JS gets its own suite.
      - name: Test the terminal script
        run: node scripts/test_terminal_js.js
      # The README table is what a consumer reads before deciding whether to
      # switch a group off. It listed seven crawlers the template never names,
      # which is worse than listing none: turning allowTraining off while
      # believing AI2Bot was in it is a block that did not happen.
      - name: Assert the README names the crawlers the template does
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          tpl = pathlib.Path('layouts/robots.txt').read_text(encoding='utf-8')
          readme = pathlib.Path('README.md').read_text(encoding='utf-8')
          bad = []

          def slice_names(var):
              m = re.search(r'\$%s := slice(.*?)-\}\}' % var, tpl, re.S)
              if not m:
                  sys.exit('robots.txt no longer declares $%s' % var)
              return set(re.findall(r'"([^"]+)"', m.group(1)))

          def row_names(switch):
              m = re.search(r'^\|\s*`%s`\s*\|(.*?)\|' % switch, readme, re.M)
              if not m:
                  sys.exit('README has no table row for `%s`' % switch)
              return set(re.findall(r'`([^`]+)`', m.group(1)))

          for var, switch in (('answerEngines', 'allowAI'),
                              ('trainingCrawlers', 'allowTraining')):
              in_tpl, in_doc = slice_names(var), row_names(switch)
              for name in sorted(in_doc - in_tpl):
                  bad.append('%s: README lists %s, which the template does not send'
                             % (switch, name))
              for name in sorted(in_tpl - in_doc):
                  bad.append('%s: the template sends %s, which the README does not list'
                             % (switch, name))

          if bad:
              sys.exit('\n'.join('crawlers: ' + b for b in bad))
          print('crawlers: the README table and layouts/robots.txt name the same bots')
          PY

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 0.158.0 is the min_version declared in theme.toml — without building
        # against it, that promise to consumers is never actually checked.
        # Keep 0.163.3 in sync with pages.yml and netlify.toml.
        hugo-version: ['0.158.0', '0.163.3']
    env:
      HUGO_VERSION: ${{ matrix.hugo-version }}
      HUGO_ENV: production
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Hugo (extended)
        run: |
          wget -O /tmp/hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
      - name: Inject theme into exampleSite
        run: |
          mkdir -p exampleSite/themes
          ln -sfn "$GITHUB_WORKSPACE" exampleSite/themes/terminal-mono
      # Build under a sub-path: the demo is served from one, and under a root
      # baseURL the nav/404 sub-path handling renders identically whether or
      # not it is correct (see 33a5de8), leaving that path unexercised.
      - name: Build exampleSite
        run: |
          hugo --source exampleSite --gc --minify \
            --printI18nWarnings --panicOnWarning \
            --baseURL "https://example.com/terminal-mono/"
      # Everything AEO fails silently. A Sitemap line pointing at a file that is
      # not in the build still serves 200; a JSON-LD block with a typo still
      # renders and a crawler just skips it; an author that references an @id no
      # node defines is a graph with a hole in it, and no browser will ever say
      # so. The build is the fixture and check_aeo.py is the review.
      - name: Assert the AEO output
        run: |
          set -eo pipefail
          python3 scripts/check_aeo.py exampleSite/public
          # …and the one page that has to stay silent. The 404 is not in the
          # content tree, so a BreadcrumbList there describes a hierarchy that
          # does not contain it and a WebSite node invites a crawler to treat an
          # error as a document. Both languages, because the check is on .Kind
          # and a per-language 404 is still a 404.
          for f in exampleSite/public/404.html exampleSite/public/pt/404.html; do
            [ -f "$f" ] || continue
            if grep -qF 'application/ld+json' "$f"; then
              echo "aeo: $f carries structured data"
              exit 1
            fi
          done
          echo 'aeo: the 404 stays out of the graph'
      # `allowIndexing` reaches an `if`, and `if` accepts anything — so the
      # string "false" is a non-empty string, which is true, and the spelling
      # that most plainly means "do not index" was switching indexing on. On a
      # preview deploy, silently. head.html and robots.txt now read one partial,
      # so the other half of this is that they cannot answer it differently.
      - name: Assert allowIndexing only accepts a boolean
        run: |
          set -uo pipefail
          build() {
            d="/tmp/idx-$1"
            rm -rf "$d"; mkdir -p "$d/themes" "$d/content/blogs"
            ln -sfn "$GITHUB_WORKSPACE" "$d/themes/terminal-mono"
            printf 'baseURL = "https://example.com/t/"\ntitle = "Idx"\ntheme = "terminal-mono"\nenableRobotsTXT = true\n%b' "$2" > "$d/hugo.toml"
            printf -- '---\ntitle: "P"\ndate: 2026-01-01\n---\nbody\n' > "$d/content/blogs/p.md"
            hugo --source "$d" --gc --minify --environment development > "$d.log" 2>&1 || { cat "$d.log"; exit 1; }
            echo "$d"
          }
          fail=0
          say() { echo "indexable: $1"; fail=1; }
          noindexed() { grep -qF 'name=robots' "$1/public/index.html"; }
          closed() { grep -qE '^Disallow: /$' "$1/public/robots.txt"; }

          # A real true opens a non-production build; nothing else does.
          yes=$(build yes '[params]\n  allowIndexing = true\n') || exit 1
          if noindexed "$yes"; then say 'allowIndexing = true still emitted noindex'; fi
          if closed "$yes"; then say 'allowIndexing = true still disallowed everything'; fi

          # The string is the defect: it has to warn and hold the build out.
          str=$(build str '[params]\n  allowIndexing = "false"\n') || exit 1
          if ! noindexed "$str"; then say 'allowIndexing = "false" switched indexing on'; fi
          if ! closed "$str"; then say 'allowIndexing = "false" opened robots.txt'; fi
          if ! grep -qF 'allowIndexing must be true or false' "$str.log"; then
            say 'the string went through without a warning'
          fi

          # …and in every shape the two files answer the question the same way.
          absent=$(build absent '') || exit 1
          for d in "$yes" "$str" "$absent"; do
            if noindexed "$d" && ! closed "$d"; then
              say "$(basename "$d"): noindex in the head, open robots.txt"
            fi
            if ! noindexed "$d" && closed "$d"; then
              say "$(basename "$d"): indexable head, closed robots.txt"
            fi
          done
          [ "$fail" = 0 ] || exit 1
          echo 'indexable: only a real boolean opens a preview, and the head and robots.txt agree'
      - name: Assert a hostile title survives the graph
        run: |
          set -eo pipefail
          d=/tmp/aeo-title
          rm -rf "$d"; mkdir -p "$d/themes" "$d/content/blogs"
          ln -sfn "$GITHUB_WORKSPACE" "$d/themes/terminal-mono"
          printf 'baseURL = "https://example.com/t/"\ntitle = "Titles"\ntheme = "terminal-mono"\nenableRobotsTXT = true\n' > "$d/hugo.toml"
          cat > "$d/content/blogs/entities.md" <<'MD'
          ---
          title: "Vue & Vitest: what's next? <b>bold</b> \"quoted\" 🚀"
          date: 2026-01-01
          tags: ["vue"]
          ---
          Body.
          MD
          python3 - "$d" <<'PY'
          import pathlib, sys
          # 118 characters, so the cap has to do something, and the word boundary
          # lands where truncate's ellipsis used to push the result to 111.
          title = ("word " * 40)[:118].strip().ljust(118, "x")
          (pathlib.Path(sys.argv[1]) / "content/blogs/long.md").write_text(
              '---\ntitle: "%s"\ndate: 2026-01-02\ntags: ["vue"]\n---\nBody.\n' % title)
          PY
          hugo --source "$d" --gc --minify --panicOnWarning > "$d.log" 2>&1 || { cat "$d.log"; exit 1; }
          python3 scripts/check_aeo.py "$d/public"
          python3 - "$d" <<'PY'
          import json, pathlib, re, sys

          pub = pathlib.Path(sys.argv[1]) / 'public'
          bad = []
          seen = 0
          for path in sorted(pub.glob('blogs/*/index.html')):
              html = path.read_text(encoding='utf-8')
              for block in re.findall(
                      r'<script[^>]*ld\+json[^>]*>(.*?)</script>', html, re.S):
                  data = json.loads(block)
                  for node in (data.get('@graph') or [data]):
                      if node.get('@type') != 'BlogPosting':
                          continue
                      seen += 1
                      head, name = node['headline'], node['name']
                      if len(head) > 110:
                          bad.append('%s: headline is %d characters'
                                     % (path.parent.name, len(head)))
                      if not name.startswith(head.rstrip('…')):
                          bad.append('%s: headline %r is not the start of name %r'
                                     % (path.parent.name, head, name))
                      if re.search(r'&(amp|lt|gt|quot|#\d+|#x[0-9a-fA-F]+);', head):
                          bad.append('%s: headline carries HTML entities: %r'
                                     % (path.parent.name, head))
          if seen != 2:
              bad.append('expected 2 BlogPosting nodes, found %d' % seen)
          if bad:
              sys.exit('\n'.join('title: ' + b for b in bad))
          print('title: an ampersand, an apostrophe, markup, a quote, an emoji '
                'and 118 characters all come through the graph intact')
          PY
      # The switches, one fixture each. A veto nobody exercises is a claim.
      - name: Assert the AEO switches
        run: |
          set -eo pipefail
          build() {
            d="/tmp/aeo-$1"; shift
            rm -rf "$d"; mkdir -p "$d/themes"
            ln -sfn "$GITHUB_WORKSPACE" "$d/themes/terminal-mono"
            printf 'baseURL = "https://example.com/t/"\ntitle = "AEO"\ntheme = "terminal-mono"\nenableRobotsTXT = true\n%b' "$1" > "$d/hugo.toml"
            shift
            HUGO_ENV="${1:-production}" hugo --source "$d" --gc --minify --panicOnWarning > "$d.log" 2>&1 || { cat "$d.log"; exit 1; }
            echo "$d/public"
          }
          # Read one bot's verdict out of the file the same way a crawler would,
          # so the assertion is about robots.txt semantics and not about which
          # line the template happened to emit.
          verdict() {
            python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          import check_aeo
          groups = check_aeo.parse_robots(open(sys.argv[1]).read())
          print('allowed' if check_aeo.allowed(groups, sys.argv[2]) else 'blocked')
          " "$1/robots.txt" "$2"
          }
          expect() {
            got=$(verdict "$1" "$2")
            if [ "$got" != "$3" ]; then
              echo "aeo: $4 — $2 came out $got, expected $3"
              cat "$1/robots.txt"
              exit 1
            fi
          }

          d=$(build default '' production)
          expect "$d" GPTBot allowed 'the default'
          expect "$d" PerplexityBot allowed 'the default'

          # allowTraining vetoes one group and leaves the other alone. Getting
          # this backwards is the whole reason they are two switches.
          d=$(build notraining '[params.aeo]\n  allowTraining = false\n' production)
          expect "$d" GPTBot blocked 'allowTraining = false'
          expect "$d" ClaudeBot blocked 'allowTraining = false'
          expect "$d" PerplexityBot allowed 'allowTraining = false'
          expect "$d" OAI-SearchBot allowed 'allowTraining = false'

          d=$(build noai '[params.aeo]\n  allowAI = false\n' production)
          expect "$d" PerplexityBot blocked 'allowAI = false'
          expect "$d" GPTBot allowed 'allowAI = false'

          # A path excluded from `*` has to be excluded from every group that
          # names a bot, because a bot that matched its own name never reads the
          # `*` group. This is the assertion that catches the inheritance error.
          d=$(build disallow '[params.aeo]\n  disallow = ["/drafts/"]\n' production)
          n=$(grep -c '^Disallow: /drafts/$' "$d/robots.txt")
          g=$(grep -c '^Allow: /$' "$d/robots.txt")
          if [ "$n" != "$g" ]; then
            echo "aeo: /drafts/ is excluded from $n of $g allowed groups"
            cat "$d/robots.txt"
            exit 1
          fi

          # A preview that says noindex in the <head> and invites crawlers in
          # robots.txt is worse than either alone.
          d=$(build preview '' development)
          expect "$d" GPTBot blocked 'a non-production build'
          if ! grep -q 'noindex' "$d/index.html"; then
            echo 'aeo: the non-production build did not emit the noindex meta either'
            exit 1
          fi

          # enableRobotsTXT is the site's to set. Without it Hugo publishes
          # nothing, and that has to stay a quiet no-op rather than an error.
          d=/tmp/aeo-noflag
          rm -rf "$d"; mkdir -p "$d/themes"
          ln -sfn "$GITHUB_WORKSPACE" "$d/themes/terminal-mono"
          printf 'baseURL = "https://example.com/t/"\ntitle = "AEO"\ntheme = "terminal-mono"\n' > "$d/hugo.toml"
          HUGO_ENV=production hugo --source "$d" --gc --minify --panicOnWarning > "$d.log" 2>&1 || { cat "$d.log"; exit 1; }
          if [ -f "$d/public/robots.txt" ]; then
            echo 'aeo: robots.txt was published without enableRobotsTXT'
            exit 1
          fi
          # A scalar where the table belongs. robots.txt is the only reader, so
          # this is the one fixture that can reach the guard at all.
          d=/tmp/aeo-scalar
          rm -rf "$d"; mkdir -p "$d/themes"
          ln -sfn "$GITHUB_WORKSPACE" "$d/themes/terminal-mono"
          printf 'baseURL = "https://example.com/t/"\ntitle = "AEO"\ntheme = "terminal-mono"\nenableRobotsTXT = true\n[params]\n  aeo = "x"\n' > "$d/hugo.toml"
          HUGO_ENV=production hugo --source "$d" --gc --minify > "$d.log" 2>&1 || { cat "$d.log"; exit 1; }
          if ! grep -qF '[params.aeo] must be a table' "$d.log"; then
            echo 'aeo: a scalar [params.aeo] did not warn'
            cat "$d.log"
            exit 1
          fi
          if ! grep -q '^Allow: /$' "$d/public/robots.txt"; then
            echo 'aeo: it warned and then did not fall back to the defaults'
            cat "$d/public/robots.txt"
            exit 1
          fi
          # And a boolean written as a string, which is the failure params-bool
          # exists for: "false" is a non-empty string, so an `if` reads it true
          # and the switch turns the thing on.
          printf 'baseURL = "https://example.com/t/"\ntitle = "AEO"\ntheme = "terminal-mono"\nenableRobotsTXT = true\n[params.aeo]\n  allowTraining = "false"\n' > "$d/hugo.toml"
          HUGO_ENV=production hugo --source "$d" --gc --minify > "$d.log" 2>&1 || { cat "$d.log"; exit 1; }
          if ! grep -qF '[params.aeo] allowTraining must be true or false' "$d.log"; then
            echo 'aeo: allowTraining = "false" did not warn'
            cat "$d.log"
            exit 1
          fi
          echo 'aeo: both switches veto their own group and nobody else'"'"'s'
      # Person is what a portfolio has; Organization is a claim a site makes
      # about itself, and Google will not use one without a logo. The two carry
      # different fields, so this asserts what each drops as well as what it adds.
      - name: Assert the publisher type
        run: |
          set -eo pipefail
          d=/tmp/aeo-org
          rm -rf "$d"; mkdir -p "$d/themes" "$d/static/img"
          ln -sfn "$GITHUB_WORKSPACE" "$d/themes/terminal-mono"
          printf 'logo' > "$d/static/img/logo.png"
          printf 'baseURL = "https://example.com/t/"\ntitle = "ACME"\ntheme = "terminal-mono"\n[params]\n  [params.hero]\n    subtitle = "Studio"\n  [params.schema]\n    type = "Organization"\n    logo = "/img/logo.png"\n' > "$d/hugo.toml"
          HUGO_ENV=production hugo --source "$d" --gc --minify --panicOnWarning > "$d.log" 2>&1 || { cat "$d.log"; exit 1; }
          python3 - <<'PY'
          import json, pathlib, re, sys

          html = pathlib.Path('/tmp/aeo-org/public/index.html').read_text()
          nodes = [json.loads(b) for b in re.findall(
              r"""<script[^>]*type=["']?application/ld\+json["']?[^>]*>(.*?)</script>""",
              html, re.S)]
          by_type = {n.get('@type'): n for n in nodes}
          bad = []
          org = by_type.get('Organization')
          if org is None:
              bad.append('[params.schema] type = "Organization" did not change the type: %s'
                         % list(by_type))
          else:
              # The leading slash is the part that used to break. absURL reads a
              # rooted path as rooted at the host, which drops the baseURL
              # sub-path — so "/img/logo.png" resolved off the site entirely.
              url = (org.get('logo') or {}).get('url')
              if url != 'https://example.com/t/img/logo.png':
                  bad.append('the logo resolved to %r, losing the baseURL sub-path' % url)
              if 'jobTitle' in org:
                  bad.append('an Organization carries jobTitle, which belongs to a Person')
          if 'Person' in by_type:
              bad.append('both a Person and an Organization were emitted')
          if bad:
              sys.exit('\n'.join('schema: ' + b for b in bad))
          print('schema: Organization carries its logo under the sub-path, and no jobTitle')
          PY
          # And an unknown type warns rather than emitting it.
          sed -i 's/type = "Organization"/type = "Sasquatch"/' "$d/hugo.toml"
          HUGO_ENV=production hugo --source "$d" --gc --minify > "$d.log" 2>&1
          if ! grep -qF 'is not Person or Organization' "$d.log"; then
            echo 'schema: an unknown publisher type did not warn'
            cat "$d.log"
            exit 1
          fi
          if ! grep -qF '"@type":"Person"' "$d/public/index.html"; then
            echo 'schema: it warned and then did not fall back to Person'
            exit 1
          fi
          echo 'schema: an unknown type warns and falls back'
      # The exampleSite fills in every param; a fresh consumer fills in none.
      # That path broke once already (see 41451a3), and the exampleSite build
      # stays green through it.
      - name: Build a bare site (no params) against the theme
        run: |
          mkdir -p /tmp/bare/themes
          ln -sfn "$GITHUB_WORKSPACE" /tmp/bare/themes/terminal-mono
          printf 'baseURL = "https://example.com/terminal-mono/"\ntitle = "Bare Site"\ntheme = "terminal-mono"\n' > /tmp/bare/hugo.toml
          hugo --source /tmp/bare --gc --minify --panicOnWarning
          # A param the site never set must not reach the page as Go's printf
          # garbage. --panicOnWarning cannot catch this: nothing warns, the
          # template does exactly what it was told. This very fixture shipped
          # `<title>Bare Site — %!s(<nil>)</title>` until the subtitle got a
          # fallback, and the green build said nothing about it.
          if grep -rq '%!s(\|%!d(\|%!v(' /tmp/bare/public --include='*.html'; then
            echo 'bare: a param rendered as printf garbage'
            grep -rho '%![sdv]([^)]*)' /tmp/bare/public --include='*.html' | sort -u | head -5
            exit 1
          fi
          # The fallback has to be the site name, not an empty half-title.
          if ! grep -q '<title>Bare Site</title>' /tmp/bare/public/index.html; then
            echo 'bare: the home title did not fall back to the site name'
            grep -o '<title>[^<]*</title>' /tmp/bare/public/index.html
            exit 1
          fi
      # The three asset params — [params.favicon], [params.ogImage] and a post's
      # `image` — are the only ones the exampleSite leaves empty, so the path
      # they take was never built by CI: no warning, no broken build, and under
      # a sub-path baseURL a rooted spelling silently resolved outside the site
      # (#37). Two builds, one per spelling, and the assertion is the one that
      # was missing — every URL the build emits has to name a file the build
      # actually published.
      - name: Assert the asset params resolve under a sub-path
        run: |
          set -eo pipefail
          d=/tmp/subpath
          rm -rf "$d"; mkdir -p "$d/themes" "$d/static/img" "$d/content/blogs"
          ln -sfn "$GITHUB_WORKSPACE" "$d/themes/terminal-mono"
          printf 'x' > "$d/static/my-favicon.svg"
          printf 'x' > "$d/static/img/og.png"
          printf 'x' > "$d/static/img/banner.png"
          # $1 is the leading slash, or nothing — the two spellings a person
          # writes. $2 is where the build lands.
          build() {
            printf 'baseURL = "https://example.com/t/"\ntitle = "Sub"\ntheme = "terminal-mono"\n[params]\n  favicon = "%smy-favicon.svg"\n  ogImage = "%simg/og.png"\n' "$1" "$1" > "$d/hugo.toml"
            printf -- '---\ntitle: "P"\ndate: 2026-01-01\nimage: "%simg/banner.png"\n---\nbody\n' "$1" > "$d/content/blogs/p.md"
            hugo --source "$d" --gc --minify --panicOnWarning --destination "$2"
          }
          build /  "$d/out-rooted"
          build "" "$d/out-bare"
          # The escape hatch the trim has to leave open, in both spellings of
          # "another host": a scheme-ful URL, and a network-path reference
          # (//host/path, RFC 3986 4.2). Neither has a single leading slash to
          # cut — but relURL and absURL recognise the second by its leading "//",
          # so a trim that ran unguarded would hand them /cdn.example/x and they
          # would rewrite it onto this site. $1 is the host prefix.
          offsite() {
            printf 'baseURL = "https://example.com/t/"\ntitle = "Sub"\ntheme = "terminal-mono"\n[params]\n  favicon = "%sfav.svg"\n  ogImage = "%sog.png"\n' "$1" "$1" > "$d/hugo.toml"
            printf -- '---\ntitle: "P"\ndate: 2026-01-01\nimage: "%sbanner.png"\n---\nbody\n' "$1" > "$d/content/blogs/p.md"
            hugo --source "$d" --gc --minify --panicOnWarning --destination "$2"
          }
          offsite https://cdn.example/ "$d/out-cdn"
          offsite //cdn.example/       "$d/out-proto"
          python3 - <<'PY'
          import pathlib, re, sys

          BASE = 'https://example.com/t/'
          bad = []

          # Minified HTML drops the quotes around any value that has no spaces in
          # it, so every read here has to accept both `href="/t/x"` and `href=/t/x`.
          def attr(tag, name):
              m = re.search(r'\b%s=(?:"([^"]*)"|\'([^\']*)\'|([^"\'>\s]+))' % name, tag)
              if not m:
                  return None
              return next(g for g in m.groups() if g is not None)

          def emitted(html):
              """The three URLs the asset params put on a page, by name."""
              out = {}
              m = re.search(r'<link\b[^>]*\brel=["\']?icon\b[^>]*>', html, re.I)
              if m:
                  out['favicon'] = attr(m.group(0), 'href')
              for tag in re.findall(r'<meta\b[^>]*>', html, re.I):
                  key = attr(tag, 'property') or attr(tag, 'name') or ''
                  if key.lower() in ('og:image', 'twitter:image'):
                      out[key.lower()] = attr(tag, 'content')
              m = re.search(r'background-image:\s*url\((["\']?)([^"\')]+)\1\)', html)
              if m:
                  out['banner'] = m.group(2)
              return out

          def resolves(out, where, label, url):
              """A URL the build emitted names a file the build published."""
              if '://' in url:
                  if not url.startswith(BASE):
                      bad.append('%s %s: %s left the site — %s'
                                 % (out.name, where, label, url))
                      return
                  # Back to a host-rooted path, sub-path included: that prefix is
                  # the whole point of the assertion, so it must survive the trim.
                  path = '/' + url.split('://', 1)[1].split('/', 1)[1]
              else:
                  path = url
              if not path.startswith('/t/'):
                  bad.append('%s %s: %s dropped the sub-path — %s'
                             % (out.name, where, label, url))
              elif not (out / path[len('/t/'):]).is_file():
                  bad.append('%s %s: %s points at %s, which is not in the build'
                             % (out.name, where, label, url))

          PAGES = ['index.html', 'blogs/p/index.html']
          # The post page is the one that carries all three at once — its banner
          # and its og:image come from the same front matter key by two different
          # routes, which is exactly how #37 managed to fail twice on one page.
          WANT = {'index.html': ['favicon', 'og:image', 'twitter:image'],
                  'blogs/p/index.html': ['favicon', 'og:image', 'twitter:image',
                                         'banner']}

          seen = {}
          for name in ['out-rooted', 'out-bare']:
              out = pathlib.Path('/tmp/subpath') / name
              seen[name] = {}
              for page in PAGES:
                  found = emitted((out / page).read_text())
                  seen[name][page] = found
                  for label in WANT[page]:
                      url = found.get(label)
                      if url is None:
                          bad.append('%s %s: emitted no %s' % (name, page, label))
                      else:
                          resolves(out, page, label, url)

          # And the two spellings have to agree. Asserting each one separately
          # would still pass if they resolved to two different working URLs.
          for page in PAGES:
              if seen['out-rooted'][page] != seen['out-bare'][page]:
                  bad.append('%s: the two spellings emit different URLs\n'
                             '  "/img/x": %r\n   "img/x": %r'
                             % (page, seen['out-rooted'][page],
                                seen['out-bare'][page]))

          # Driven by WANT, not by what the build emitted: iterating what was
          # found would let a page that emitted nothing at all pass this arm in
          # silence, which is the same hole the two arms above already close.
          for name, prefix in [('out-cdn', 'https://cdn.example/'),
                               ('out-proto', '//cdn.example/')]:
              off = pathlib.Path('/tmp/subpath') / name
              for page in PAGES:
                  found = emitted((off / page).read_text())
                  for label in WANT[page]:
                      url = found.get(label)
                      if url is None:
                          bad.append('%s %s: emitted no %s' % (name, page, label))
                      elif not url.startswith(prefix):
                          bad.append('%s %s: %s did not pass through — %s'
                                     % (name, page, label, url))

          if bad:
              sys.exit('\n'.join(bad))
          print('sub-path: both spellings of favicon, ogImage and image resolve '
                'inside the baseURL, and both spellings of an off-site URL pass '
                'through')
          PY
      # Hugo's fallback for a missing translation is the site's own
      # defaultContentLanguage, not the theme's i18n/en.toml — so a site whose
      # default language the theme ships no strings for rendered every label as
      # the empty string, on a green build, until t.html put English underneath
      # (see #32). --panicOnWarning is deliberately absent from the fixtures that
      # are meant to warn: the warning is half of what they assert.
      - name: Assert an untranslated language falls back to English
        run: |
          set -eo pipefail
          d=/tmp/untranslated
          rm -rf "$d"; mkdir -p "$d/themes" "$d/content/blogs"
          ln -sfn "$GITHUB_WORKSPACE" "$d/themes/terminal-mono"
          cat > "$d/hugo.toml" <<'TOML'
          baseURL = "https://example.com/"
          title = "Sin Traducir"
          theme = "terminal-mono"
          defaultContentLanguage = "es"
          [languages.es]
            locale = "es-ES"
            weight = 1
            [languages.es.params.contact]
              btnLink = "mailto:hola@example.com"
          TOML
          # A tagged post, because the one string that takes a count and
          # interpolates it is the only caller that hands t.html a dict, and
          # a site with no content never renders it.
          cat > "$d/content/blogs/uno.md" <<'MD'
          +++
          title = "Uno"
          date = 2026-01-01
          tags = ["hugo"]
          +++
          Contenido.
          MD
          hugo --source "$d" --gc --minify 2>&1 | tee "$d/build.log"
          if ! grep -q 'terminal-mono: no UI strings for language "es"' "$d/build.log"; then
            echo 'untranslated: the build said nothing about the missing strings'
            exit 1
          fi
          # The strings the reader sees, not just the ones the log mentions.
          # Three partials, three shapes: the hero intro reaches the page through
          # a `default` chain, the contact button through `with`, and the skip
          # link straight — and the empty render was visible in all three.
          for s in 'hi, my name is' 'send email' 'Skip to content'; do
            if ! grep -qF "$s" "$d/public/index.html"; then
              echo "untranslated: \"$s\" did not fall back to English"
              exit 1
            fi
          done
          if ! grep -qF '1 post(s) tagged' "$d/public/tags/hugo/index.html"; then
            echo 'untranslated: the counted string did not interpolate its count'
            grep -o '<p>[^<]*' "$d/public/tags/hugo/index.html" | head -2
            exit 1
          fi
      # The fixture above only ever exercised the *default* language, and that
      # is the one case Hugo cannot paper over. For any other language it
      # substitutes the default language's string, so asking `i18n` for the
      # value — which is what the check used to do — could never see a second
      # language as untranslated: [languages.es] with no i18n/es.toml, the setup
      # the README walks you through, warned about nothing at all.
      - name: Assert an untranslated second language is reported
        run: |
          set -eo pipefail
          d=/tmp/second-language
          rm -rf "$d"; mkdir -p "$d/themes"
          ln -sfn "$GITHUB_WORKSPACE" "$d/themes/terminal-mono"
          cat > "$d/hugo.toml" <<'TOML'
          baseURL = "https://example.com/"
          title = "Two Languages"
          theme = "terminal-mono"
          defaultContentLanguage = "en"
          [languages.en]
            weight = 1
          [languages.es]
            weight = 2
          TOML
          hugo --source "$d" --gc --minify 2>&1 | tee "$d/build.log"
          if ! grep -q 'terminal-mono: no UI strings for language "es"' "$d/build.log"; then
            echo 'second-language: es has no strings file and the build did not say so'
            exit 1
          fi
          if grep -q 'for language "en"' "$d/build.log"; then
            echo 'second-language: en is fully translated and was reported anyway'
            exit 1
          fi
          if ! grep -qF 'Skip to content' "$d/public/es/index.html"; then
            echo 'second-language: /es/ did not fall back to English'
            exit 1
          fi
      # The fallback table used to come from os.ReadFile "i18n/en.toml", and the
      # union filesystem returns the *first* match for that path: a site with a
      # one-key i18n/en.toml left a one-key fallback behind and the other 48
      # labels went blank again — #32, unfixed, on a green build. It comes from
      # the theme's own mount at data/terminal_mono_i18n now, with the site's
      # English merged over it. The comma and colon in the comment are the other
      # half of the fixture: handed a bare string, transform.Unmarshal sniffs the
      # format from the first `=`, `:`, `,` or `{` it finds, so a comma there
      # read the whole file as CSV and took the build down with it.
      - name: Assert a site's own i18n/en.toml cannot collapse the fallback
        run: |
          set -eo pipefail
          d=/tmp/site-english
          rm -rf "$d"; mkdir -p "$d/themes" "$d/i18n"
          ln -sfn "$GITHUB_WORKSPACE" "$d/themes/terminal-mono"
          cat > "$d/hugo.toml" <<'TOML'
          baseURL = "https://example.com/"
          title = "Own English"
          theme = "terminal-mono"
          defaultContentLanguage = "es"
          [languages.es]
            weight = 1
            [languages.es.params.about]
              content = "hola"
          [[menu.main]]
            identifier = "about"
            url = "#about"
            weight = 1
          TOML
          cat > "$d/i18n/en.toml" <<'TOML'
          # UI strings, English: with a comma and a colon
          [about]
          other = "who I am"
          TOML
          hugo --source "$d" --gc --minify 2>&1 | tee "$d/build.log"
          if ! grep -qF 'Skip to content' "$d/public/index.html"; then
            echo 'site-english: an unparseable site i18n/en.toml collapsed the fallback'
            exit 1
          fi
          if ! grep -q 'terminal-mono: could not parse i18n/en.toml' "$d/build.log"; then
            echo 'site-english: the file could not be read and the build did not say so'
            exit 1
          fi
          # Same file, now parseable: the string the site overrode wins, in the
          # section heading and in the nav — the nav label goes through t.html
          # for exactly this reason.
          cat > "$d/i18n/en.toml" <<'TOML'
          # English overrides
          [about]
          other = "who I am"
          TOML
          hugo --source "$d" --gc --minify 2>&1 | tee "$d/build.log"
          if [ "$(grep -cF 'who I am' "$d/public/index.html")" -lt 2 ]; then
            echo 'site-english: the override did not reach both the nav and the heading'
            grep -o '#about">[^<]*' "$d/public/index.html" || true
            exit 1
          fi
          if ! grep -qF 'Skip to content' "$d/public/index.html"; then
            echo 'site-english: overriding one string collapsed the other 48'
            exit 1
          fi
      # The branch that names the missing keys had never run in CI, and neither
      # had a key whose value is "" — a blank label is the failure the whole
      # path exists to make visible, so an empty string counts as missing.
      - name: Assert a partial translation names what is missing
        run: |
          set -eo pipefail
          d=/tmp/partial-i18n
          rm -rf "$d"; mkdir -p "$d/themes" "$d/i18n"
          ln -sfn "$GITHUB_WORKSPACE" "$d/themes/terminal-mono"
          cat > "$d/hugo.toml" <<'TOML'
          baseURL = "https://example.com/"
          title = "Parcial"
          theme = "terminal-mono"
          defaultContentLanguage = "es"
          [languages.es]
            weight = 1
          TOML
          cat > "$d/i18n/es.toml" <<'TOML'
          [skip_to_content]
          other = "Ir al contenido"
          [about]
          other = ""
          TOML
          hugo --source "$d" --gc --minify 2>&1 | tee "$d/build.log"
          if ! grep -qE 'terminal-mono: [0-9]+ of [0-9]+ UI strings are missing for language "es"' "$d/build.log"; then
            echo 'partial-i18n: a half-translated language was not reported as one'
            exit 1
          fi
          if ! grep -q 'add them to i18n/es.toml: about, ' "$d/build.log"; then
            echo 'partial-i18n: the message did not name the missing keys'
            exit 1
          fi
          if ! grep -qF 'Ir al contenido' "$d/public/index.html"; then
            echo 'partial-i18n: the one translated string did not render'
            exit 1
          fi
      # --printI18nWarnings and --panicOnWarning together (what the exampleSite
      # build above runs under) make a missing key return an *error* from i18n
      # rather than an empty string. Without the try() in t.html the build aborts
      # at the lookup, inside the partial whose whole job is to keep that from
      # happening — and a menu identifier the theme ships no string for is the
      # ordinary way to reach it.
      - name: Assert the strict i18n flags do not abort on a missing key
        run: |
          set -eo pipefail
          d=/tmp/strict-i18n
          rm -rf "$d"; mkdir -p "$d/themes"
          ln -sfn "$GITHUB_WORKSPACE" "$d/themes/terminal-mono"
          cat > "$d/hugo.toml" <<'TOML'
          baseURL = "https://example.com/"
          title = "Strict"
          theme = "terminal-mono"
          [[menu.main]]
            identifier = "portfolio"
            url = "#projects"
            weight = 1
          TOML
          if ! hugo --source "$d" --gc --minify --printI18nWarnings --panicOnWarning > "$d/build.log" 2>&1; then
            cat "$d/build.log"
            echo 'strict-i18n: a menu identifier with no translation aborted the build'
            exit 1
          fi
          if ! grep -q '>portfolio<' "$d/public/index.html"; then
            echo 'strict-i18n: the entry never rendered, so nothing was looked up'
            exit 1
          fi
      # Declaring any [[module.mounts]] replaces the default mounts for every
      # component, not just the one declared, so the theme's hugo.toml spells out
      # the ones it needs. Add a component directory and forget the line and it
      # stops shipping — silently for archetypes, which nothing else here builds.
      - name: Assert every component directory is mounted
        run: |
          set -eo pipefail
          rc=0
          for c in archetypes assets content data i18n layouts static; do
            [ -d "$GITHUB_WORKSPACE/$c" ] || continue
            if ! grep -q "source = \"$c\"" "$GITHUB_WORKSPACE/hugo.toml"; then
              echo "mounts: $c/ exists in the theme but hugo.toml does not mount it"
              rc=1
            fi
          done
          exit $rc
      # The exampleSite ships lime with [params.theme] commented out, so without
      # this step four of the five palettes, the override block, the per-palette
      # favicon and the theme-color are all shipped unexecuted — 400-odd lines
      # of feature behind one exercised path. One build per palette, each into
      # its own destination so the cross-check below can read all five at once.
      - name: Build every palette
        run: |
          set -e
          d=/tmp/palette
          rm -rf "$d"; mkdir -p "$d/themes"
          ln -sfn "$GITHUB_WORKSPACE" "$d/themes/terminal-mono"
          for p in lime amber cyberpunk ice mono; do
            printf 'baseURL = "https://example.com/t/"\ntitle = "Palette"\ntheme = "terminal-mono"\n[params.theme]\n  palette = "%s"\n' "$p" > "$d/hugo.toml"
            if ! hugo --source "$d" --gc --minify --panicOnWarning --destination "$d/out-$p" > "$d.log" 2>&1; then
              cat "$d.log"
              echo "$p: a palette this theme ships failed to build"
              exit 1
            fi
            h="$d/out-$p/index.html"
            if ! grep -qE "data-palette=\"?$p\"?[ >]" "$h"; then
              echo "$p: not stamped onto <html>"
              grep -o '<html[^>]*>' "$h"
              exit 1
            fi
            # lime is the bare :root, so it keeps the unsuffixed favicon — and
            # must not ask for a favicon-lime.svg that does not exist.
            if [ "$p" = lime ]; then want=favicon.svg; else want="favicon-$p.svg"; fi
            if ! grep -qF "rel=icon href=/t/$want" "$h"; then
              echo "$p: the favicon did not follow the palette"
              grep -o 'rel=icon[^>]*' "$h"
              exit 1
            fi
            if [ ! -f "$d/out-$p/$want" ]; then
              echo "$p: the favicon it asked for is not in the build"
              exit 1
            fi
          done
          # theme-color is the one palette value stated twice — once in the CSS
          # a browser reads, once in a Go template a browser cannot. Comparing
          # the two spellings against each other is what keeps them from drifting.
          python3 - <<'PY'
          import pathlib, re, sys

          src = pathlib.Path('assets/css/terminal.css').read_text()
          bad = []

          def ground(p):
              head = ':root{' if p == 'lime' else ':root[data-palette="%s"]{' % p
              if head not in src:
                  bad.append('%s: terminal.css defines no block for it' % p)
                  return None
              block = src.split(head, 1)[1].split('}', 1)[0]
              m = re.search(r'--bg:\s*(#[0-9a-fA-F]{3,8})', block)
              if not m:
                  bad.append('%s: its block declares no --bg' % p)
                  return None
              return m.group(1).lower()

          for p in ['lime', 'amber', 'cyberpunk', 'ice', 'mono']:
              html = pathlib.Path('/tmp/palette/out-%s/index.html' % p).read_text()
              m = re.search(r'<meta name=["\']?theme-color["\']?[^>]*?content=["\']?([^"\'>\s]+)', html)
              if not m:
                  bad.append('%s: no <meta name="theme-color">' % p)
                  continue
              want = ground(p)
              if want and m.group(1).lower() != want:
                  bad.append('%s: theme-color is %s, terminal.css says --bg is %s'
                             % (p, m.group(1), want))

          if bad:
              sys.exit('\n'.join(bad))
          print('every palette stamps, and its theme-color matches its --bg')
          PY
      # The override is the only half of the palette feature that comes from the
      # config rather than the stylesheet, and the only half whose correctness is
      # an ordering argument: :root:root ties the specificity of a palette block,
      # so source order is what decides it. Assert the order, not just the bytes.
      - name: Build a palette override
        run: |
          set -e
          d=/tmp/override
          rm -rf "$d"; mkdir -p "$d/themes"
          ln -sfn "$GITHUB_WORKSPACE" "$d/themes/terminal-mono"
          cat > "$d/hugo.toml" <<'TOML'
          baseURL = "https://example.com/t/"
          title = "Override"
          theme = "terminal-mono"
          [params.theme]
            palette = "cyberpunk"
            [params.theme.colors]
              accent = "#00ffd5"
              bg = "#101010"
              accent-dim = "#ff2fd0"
          TOML
          hugo --source "$d" --gc --minify --panicOnWarning
          h="$d/public/index.html"
          # Every documented spelling of a key lands on its token: camelCase is
          # what the README shows, and accent-dim is what a reader copies out of
          # the stylesheet. Both have to work or the second looks like a typo.
          for want in '--accent:#00ffd5' '--accent-dim:#ff2fd0' '--bg:#101010'; do
            if ! grep -qF -- "$want" "$h"; then
              echo "override: $want never reached the page"
              grep -o '<style>[^<]*</style>' "$h"
              exit 1
            fi
          done
          # The palette is still stamped, and theme-color follows the override
          # rather than the palette it started from.
          grep -qE 'data-palette="?cyberpunk"?[ >]' "$h" || { echo 'override: the palette stopped being stamped'; exit 1; }
          grep -qE 'theme-color[^>]*content=["\x27]?#101010' "$h" || { echo 'override: theme-color ignored the --bg override'; grep -o 'theme-color[^>]*' "$h"; exit 1; }
          # The ordering argument, asserted as an ordering. A plain :root would
          # be 0,1,0 against a palette's 0,2,0 and would have lost outright;
          # :root:root ties it, which only settles the cascade while the <style>
          # is still downstream of the <link>.
          a=$(grep -bo '<link rel=stylesheet' "$h" | head -1 | cut -d: -f1)
          b=$(grep -bo '<style>:root:root' "$h" | head -1 | cut -d: -f1)
          if [ -z "$a" ] || [ -z "$b" ] || [ "$a" -ge "$b" ]; then
            echo "override: the <style> is not after the stylesheet (link@$a, style@$b)"
            exit 1
          fi
          # Rule 1 of terminal.css, as a check rather than a comment: no palette
          # color may be named literally. Read from the *built* stylesheet, where
          # the comment that has to spell the value out has been minified away.
          # The stylesheet the page actually links, not whatever a glob sorts
          # first — a stale fingerprint left in the destination is exactly the
          # file this check must not be reading.
          css="$d/public"$(grep -o '/t/css/terminal\.min\.[a-f0-9]*\.css' "$h" | head -1 | sed 's|^/t||')
          if [ ! -f "$css" ]; then
            echo "override: could not find the stylesheet the page links"
            grep -o 'href=[^ >]*\.css' "$h"
            exit 1
          fi
          if grep -qF 'rgba(182,255,60' "$css"; then
            echo 'a lime literal is back in the stylesheet, and will not follow the accent'
            grep -oF -m3 'rgba(182,255,60' "$css"
            exit 1
          fi
          # Rule 3, likewise: the structural derived tokens keep a literal base
          # outside @supports, or a browser without color-mix() renders the nav
          # and the open mobile menu transparent over the scrolling page.
          for t in --nav-bg --menu-bg --border-code; do
            if ! grep -qE -- "$t:(rgba?\(|#)" "$css"; then
              echo "$t lost its literal base — color-mix() is now its only value"
              exit 1
            fi
          done
      # One config contract, one fixture per promise it makes. Together these are
      # why "the menu drives the sections" is a checked claim and not a sentence
      # in a changelog. The params block is shared so that only the menu, the
      # switches and params.sections differ between them — whatever a fixture
      # proves, it proves about the index, not about missing content.
      - name: Build the section fixtures
        run: |
          set -e
          cat > /tmp/params.toml <<'TOML'

          [params]
            [params.about]
              content = "About the site owner."
              [params.about.skills]
                enable = true
                items = ["Go", "Hugo"]
            [params.projects]
              [[params.projects.items]]
                title = "Alpha"
                repo = "alpha"
                content = "A project."
            [params.experience]
              [[params.experience.items]]
                company = "ACME"
                [[params.experience.items.jobs]]
                  name = "Developer"
                  content = "Did things."
            [params.contact]
              title = "Let's talk?"
              content = "Reach out."
              btnLink = "mailto:hi@example.com"
          TOML

          mk() {
            mkdir -p "/tmp/$1/themes"
            ln -sfn "$GITHUB_WORKSPACE" "/tmp/$1/themes/terminal-mono"
            printf 'baseURL = "https://example.com/terminal-mono/"\ntitle = "Fixture %s"\ntheme = "terminal-mono"\n' "$1" > "/tmp/$1/hugo.toml"
          }

          # params, no menu — the v0.3.0 layout, which must not move
          mk fallback
          cat /tmp/params.toml >> /tmp/fallback/hugo.toml

          # menu reordered, projects deleted, about kept but taken out of the nav.
          # projects also gets enable = false: dropping a section from the menu
          # while its params stay filled is the shape of a menu written back when
          # [[menu.main]] only drove the nav, so the theme warns about it (see the
          # orphan fixture). enable = false is how a config says the omission is
          # deliberate — which is exactly what this fixture means.
          mk custom
          cat >> /tmp/custom/hugo.toml <<'TOML'

          [[menu.main]]
            identifier = "contact"
            url = "#contact"
            weight = 10
          [[menu.main]]
            identifier = "about"
            url = "#about"
            weight = 20
            [menu.main.params]
              showInNav = false
          [[menu.main]]
            identifier = "experience"
            url = "#experience"
            weight = 30
          TOML
          cat /tmp/params.toml >> /tmp/custom/hugo.toml
          sed -i 's/^  \[params.projects\]$/  [params.projects]\n    enable = false/' /tmp/custom/hugo.toml

          # the escape hatch: params.sections.order beats the menu for the page,
          # while the nav keeps following the menu. projects is left out of the
          # order on purpose, so it carries the same enable = false as custom.
          mk hatch
          cat >> /tmp/hatch/hugo.toml <<'TOML'

          [[menu.main]]
            identifier = "about"
            url = "#about"
            weight = 10
          [[menu.main]]
            identifier = "contact"
            url = "#contact"
            weight = 20
          TOML
          cat /tmp/params.toml >> /tmp/hatch/hugo.toml
          printf '  [params.sections]\n    order = ["contact", "about", "experience"]\n' >> /tmp/hatch/hugo.toml
          sed -i 's/^  \[params.projects\]$/  [params.projects]\n    enable = false/' /tmp/hatch/hugo.toml

          # menus and enable are both language-scoped, and one partialCached
          # entry per language is what keeps them apart. Two languages that
          # disagree about which sections exist is the assertion that a shared
          # cache would fail — and nothing else here would notice.
          mk i18n
          cat >> /tmp/i18n/hugo.toml <<'TOML'

          defaultContentLanguage = "en"
          [languages]
            [languages.en]
              weight = 1
            [languages.pt]
              weight = 2
              [languages.pt.params]
                [languages.pt.params.experience]
                  enable = false
          TOML
          cat /tmp/params.toml >> /tmp/i18n/hugo.toml
          sed -i 's/^  \[params.projects\]$/  [params.projects]\n    enable = false/' /tmp/i18n/hugo.toml

          for f in fallback custom hatch i18n; do
            hugo --source "/tmp/$f" --gc --minify --panicOnWarning
            # These four build clean under --panicOnWarning and still shipped
            # `%!s(<nil>)` in their titles until the hero subtitle got a
            # fallback: printf renders a nil param without warning about it, so
            # a green build is not evidence the page is right.
            if grep -rq '%!s(\|%!d(\|%!v(' "/tmp/$f/public" --include='*.html'; then
              echo "$f: a param rendered as printf garbage"
              grep -rho '%![sdv]([^)]*)' "/tmp/$f/public" --include='*.html' | sort -u | head -5
              exit 1
            fi
          done
      # A questionable config must warn and fall back, never take a consumer's
      # build down — so these are built WITHOUT --panicOnWarning, and the warning
      # itself is the assertion. Two of them are not user error at all:
      #
      #   toggle  enable = true on a section the menu leaves out. The switch
      #           grants nothing, so the section does not render — and a config
      #           asking for a section it will not get is worth saying out loud.
      #   orphan  a menu that names no section while every section has content.
      #           This is the v0.3.0 menu, written when [[menu.main]] drove only
      #           the nav; without the warning the whole home page silently
      #           empties out on upgrade. The one this release exists to catch.
      #
      # scalar/list guard the namespace itself: params.sections written as
      # anything but a table used to abort the build inside isset, which is the
      # one thing no configuration is allowed to do.
      - name: Assert a questionable config warns and still builds
        run: |
          set -e
          WARNS="invalid-unknown invalid-dup invalid-type invalid-empty invalid-anchor
                 invalid-scalar invalid-list invalid-hero invalid-hero-social
                 invalid-hero-icons invalid-palette invalid-colorkey invalid-colorval
                 invalid-colortype invalid-colorparen orphan toggle"
          for f in $WARNS; do
            mkdir -p "/tmp/$f/themes"
            ln -sfn "$GITHUB_WORKSPACE" "/tmp/$f/themes/terminal-mono"
            printf 'baseURL = "https://example.com/terminal-mono/"\ntitle = "Fixture %s"\ntheme = "terminal-mono"\n' "$f" > "/tmp/$f/hugo.toml"
            cat /tmp/params.toml >> "/tmp/$f/hugo.toml"
          done
          printf '  [params.sections]\n    order = ["about", "bogus"]\n' >> /tmp/invalid-unknown/hugo.toml
          printf '  [params.sections]\n    order = ["about", "about"]\n' >> /tmp/invalid-dup/hugo.toml
          printf '  [params.sections]\n    order = "about"\n'            >> /tmp/invalid-type/hugo.toml
          printf '  [params.sections]\n    order = []\n'                 >> /tmp/invalid-empty/hugo.toml
          printf '\n[[menu.main]]\n  identifier = "about"\n  url = "#sobre"\n  weight = 10\n' >> /tmp/invalid-anchor/hugo.toml
          # params.sections as a scalar and as a list: the [params] table is
          # already open, so these go in as plain keys inside it.
          sed -i '0,/^\[params\]$/s//[params]\n  sections = "about"/'               /tmp/invalid-scalar/hugo.toml
          sed -i '0,/^\[params\]$/s//[params]\n  sections = ["about", "projects"]/' /tmp/invalid-list/hugo.toml
          # params.hero is the one that breaks pages other than the home: head.html
          # reads hero.subtitle on every page, and `cond` evaluates both of its
          # branches, so a scalar aborted the whole site rather than one template.
          # The nested table and its entry list are guarded separately — normalising
          # hero itself does not reach inside it.
          sed -i '0,/^\[params\]$/s//[params]\n  hero = "x"/' /tmp/invalid-hero/hugo.toml
          printf '  [params.hero]\n    socialLinks = "x"\n' >> /tmp/invalid-hero-social/hugo.toml
          printf '  [params.hero]\n    [params.hero.socialLinks]\n      fontAwesomeIcons = ["github"]\n' >> /tmp/invalid-hero-icons/hugo.toml
          # [params.theme]: the five ways a palette or an override is wrong. Each
          # is ignored, named, and left standing — and each is a *silent* failure
          # without the warning, which is the whole argument for emitting one:
          # a key that does nothing looks identical to a feature that is broken.
          printf '  [params.theme]\n    palette = "neon"\n' >> /tmp/invalid-palette/hugo.toml
          printf '  [params.theme]\n    [params.theme.colors]\n      acccent = "#b6ff3c"\n' >> /tmp/invalid-colorkey/hugo.toml
          printf '  [params.theme]\n    [params.theme.colors]\n      accent = "red; } body { display:none } :root {"\n' >> /tmp/invalid-colorval/hugo.toml
          # Not a string, and an unclosed function: both used to be emitted. The
          # first computes to nothing everywhere var(--accent) is read; the second
          # swallows the declarations that follow it, so one bad value deletes the
          # site's *other* overrides.
          printf '  [params.theme]\n    [params.theme.colors]\n      accent = true\n' >> /tmp/invalid-colortype/hugo.toml
          printf '  [params.theme]\n    [params.theme.colors]\n      accent = "rgb("\n      bg = "#101010"\n' >> /tmp/invalid-colorparen/hugo.toml
          # orphan: the menu is real, and names nothing the page can render. The
          # post is what makes the blog entry survive, so the nav is not empty
          # for some other reason than the one under test.
          mkdir -p /tmp/orphan/content/blogs
          printf -- '---\ntitle: "A post"\ndate: 2026-01-01\n---\nx\n' > /tmp/orphan/content/blogs/post.md
          printf '\n[[menu.main]]\n  identifier = "blog"\n  pageRef = "/blogs"\n  weight = 10\n' >> /tmp/orphan/hugo.toml
          # toggle: the veto beats the menu, and `true` summons nothing.
          cat >> /tmp/toggle/hugo.toml <<'TOML'

          [[menu.main]]
            identifier = "about"
            url = "#about"
            weight = 10
          [[menu.main]]
            identifier = "experience"
            url = "#experience"
            weight = 20
          [[menu.main]]
            identifier = "contact"
            url = "#contact"
            weight = 30
          TOML
          sed -i 's/^  \[params.experience\]$/  [params.experience]\n    enable = false/' /tmp/toggle/hugo.toml
          sed -i 's/^  \[params.projects\]$/  [params.projects]\n    enable = true/'      /tmp/toggle/hugo.toml

          for f in $WARNS; do
            if ! hugo --source "/tmp/$f" --gc --minify > "/tmp/$f.log" 2>&1; then
              cat "/tmp/$f.log"
              echo "$f: a questionable config took the build down instead of warning"
              exit 1
            fi
            if ! grep -q 'WARN.*terminal-mono:' "/tmp/$f.log"; then
              cat "/tmp/$f.log"
              echo "$f: built without the warning that is the whole point"
              exit 1
            fi
            grep 'WARN.*terminal-mono:' "/tmp/$f.log"
            if grep -rq '%!s(\|%!d(\|%!v(' "/tmp/$f/public" --include='*.html'; then
              echo "$f: a param rendered as printf garbage"
              grep -rho '%![sdv]([^)]*)' "/tmp/$f/public" --include='*.html' | sort -u | head -5
              exit 1
            fi
          done
          # Warning and then handing back an empty page is only half the promise.
          # A scalar [params.hero] must leave the home standing: the title falls
          # back to the site name, and the sections the params do fill in still
          # render, because nothing about hero should reach them.
          if ! grep -q '<title>Fixture invalid-hero</title>' /tmp/invalid-hero/public/index.html; then
            echo 'invalid-hero: the title did not fall back to the site name'
            grep -o '<title>[^<]*</title>' /tmp/invalid-hero/public/index.html
            exit 1
          fi
          for s in about projects experience contact; do
            if ! grep -qE "id=\"?$s\"?[ >]" /tmp/invalid-hero/public/index.html; then
              echo "invalid-hero: a scalar hero took the $s section down with it"
              exit 1
            fi
          done
          # And it must not break the pages that never render a hero at all —
          # the row that makes this the worst of the five.
          if ! grep -q '<title>404 Page not found · Fixture invalid-hero</title>' /tmp/invalid-hero/public/404.html; then
            echo 'invalid-hero: a scalar hero reached a page that renders no hero'
            grep -o '<title>[^<]*</title>' /tmp/invalid-hero/public/404.html
            exit 1
          fi
          # A rejected value must leave no trace in the stylesheet. invalid-colorval
          # is the injection attempt; invalid-colorparen is the quieter one, where
          # the *valid* override next to it has to survive the rejected one.
          if grep -q 'display:none' /tmp/invalid-colorval/public/index.html; then
            echo 'invalid-colorval: a rejected value reached the stylesheet'
            exit 1
          fi
          if grep -q 'rgb(' /tmp/invalid-colorparen/public/index.html; then
            echo 'invalid-colorparen: an unclosed function reached the stylesheet'
            exit 1
          fi
          if ! grep -q -- '--bg:#101010' /tmp/invalid-colorparen/public/index.html; then
            echo 'invalid-colorparen: a rejected value took the valid override with it'
            grep -o '<style>[^<]*</style>' /tmp/invalid-colorparen/public/index.html
            exit 1
          fi
          # An unknown palette falls back rather than stamping itself.
          if ! grep -qE 'data-palette="?lime"?[ >]' /tmp/invalid-palette/public/index.html; then
            echo 'invalid-palette: an unknown name reached the html attribute'
            exit 1
          fi
          # The orphan warning has to name every section it dropped, not just
          # report that something went missing — the name is the actionable half.
          for s in about projects experience contact; do
            if ! grep -q "params.$s\] has content and is not turned off" /tmp/orphan.log; then
              echo "orphan: the warning never named $s"
              exit 1
            fi
          done
          # And it must stay quiet about a section that said enable = false:
          # that is the config stating the omission was deliberate.
          if grep -q 'params.experience\] has content and is not turned off' /tmp/toggle.log; then
            echo "toggle: warned about a section that was explicitly disabled"
            exit 1
          fi
          if ! grep -q 'params.projects\] has content and is not turned off' /tmp/toggle.log; then
            echo "toggle: enable = true outside the index went unreported"
            exit 1
          fi
      # Every param the theme dereferences, written as the wrong type. This is
      # the same promise sections.html states in its header -- no configuration
      # may fail the build -- but it is the *consumers* that have to keep it,
      # and each row below took a build down before params-table.html and
      # params-list.html existed. Two of them (a scalar [params.footer] and a
      # scalar [params.contact]) broke every page, not just the home.
      #
      # Table-driven because the shape is identical nine times over: write a
      # fragment, build without --panicOnWarning, assert the warning names the
      # param, assert the page still stands.
      #
      # Where the fragment goes matters, and getting it wrong makes a fixture
      # build green while proving nothing:
      #   bare   a bare key belongs to whichever table is open, so `footer = "x"`
      #          appended after a [params.x] block quietly becomes x.footer.
      #          These go in through [params] itself.
      #   about  skills = "x" has to sit *inside* [params.about]; appended it
      #          would collide with the [params.about.skills] subtable.
      #   tail   a new subtable, appended.
      #
      # The base fills [params.about] content on purpose. Without it `about`
      # never passes gate 3, about.html never runs, and a broken skills param
      # looks fixed.
      - name: Assert a mistyped param warns and still renders
        run: |
          set -e
          cat > /tmp/mistyped-base.toml <<'TOML'

          [params]
            [params.about]
              content = "About the site owner."
          TOML

          run_case() {
            name="$1"; pos="$2"; frag="$3"; expect="$4"; post="$5"
            d="/tmp/mistyped-$name"
            rm -rf "$d"; mkdir -p "$d/themes"
            ln -sfn "$GITHUB_WORKSPACE" "$d/themes/terminal-mono"
            printf 'baseURL = "https://example.com/terminal-mono/"\ntitle = "Fixture %s"\ntheme = "terminal-mono"\n' "$name" > "$d/hugo.toml"
            cat /tmp/mistyped-base.toml >> "$d/hugo.toml"
            case "$pos" in
              bare)  sed -i "0,/^\[params\]$/s//[params]\n$frag/" "$d/hugo.toml" ;;
              about) sed -i "0,/^  \[params.about\]$/s//  [params.about]\n$frag/" "$d/hugo.toml" ;;
              tail)  printf '%b' "$frag" >> "$d/hugo.toml" ;;
              front) ;;
              # about's content is the base's own reason to keep that section
              # filled, so a case that breaks content has to give the section
              # another one — otherwise gate 3 drops it, correctly, and the
              # shared "the about section is still there" assertion below fires
              # on a fixture that is behaving exactly as designed.
              content) sed -i "0,/^    content = .*$/s||$frag|" "$d/hugo.toml"
                       printf '  [params.about.skills]\n    enable = true\n    items = ["Go"]\n' >> "$d/hugo.toml" ;;
              *)     echo "$name: unknown fragment position '$pos'"; exit 1 ;;
            esac
            # Front matter is configuration a consumer writes too, and the same
            # cast aborts on it. `front` puts the mistyped param on a post
            # instead of in hugo.toml; the assertions below are unchanged.
            if [ -n "$post" ]; then
              mkdir -p "$d/content/blogs"
              printf -- '---\ntitle: "Post"\ndate: 2026-01-01\n%b\n---\nbody\n' "$post" > "$d/content/blogs/p.md"
            fi
            if ! hugo --source "$d" --gc --minify > "$d.log" 2>&1; then
              cat "$d.log"
              echo "$name: a mistyped param took the build down instead of warning"
              exit 1
            fi
            if ! grep -qF "$expect" "$d.log"; then
              cat "$d.log"
              echo "$name: no warning naming '$expect'"
              exit 1
            fi
            # Warning and then an empty page is only half the promise.
            if ! grep -q '<title>Fixture '"$name"'</title>' "$d/public/index.html"; then
              echo "$name: the home page did not render"
              exit 1
            fi
            if ! grep -qE 'id="?about"?[ >]' "$d/public/index.html"; then
              echo "$name: a mistyped param took the about section down with it"
              exit 1
            fi
            if ! grep -q '<title>' "$d/public/404.html"; then
              echo "$name: a mistyped param reached a page that renders no section"
              exit 1
            fi
            if grep -rq '%!s(\|%!d(\|%!v(\|%!q(' "$d/public" --include='*.html'; then
              echo "$name: a param rendered as printf garbage"
              grep -rho '%![sdvq]([^)]*)' "$d/public" --include='*.html' | sort -u | head -5
              exit 1
            fi
            # The warning is read by a human, so printf's error syntax is a defect
            # there too — and the log is the only place it can appear, since the
            # page nets above never look at it. `items %!q(<nil>) jobs` is what an
            # experience entry with no company name used to report.
            if grep -q '%!s(\|%!d(\|%!v(\|%!q(' "$d.log"; then
              echo "$name: the warning itself contains printf garbage"
              grep -o '%![sdvq]([^)]*)' "$d.log" | sort -u | head -5
              exit 1
            fi
            # Exactly one. Every guard is cached per param and language, so a
            # second line means the cache key drifted between two call sites and
            # the same mistake is being reported once per consumer.
            n=$(grep -c 'terminal-mono:' "$d.log")
            if [ "$n" != 1 ]; then
              echo "$name: expected exactly 1 warning, got $n"
              grep -o 'terminal-mono: .*' "$d.log"
              exit 1
            fi
            grep -o 'terminal-mono: .*' "$d.log" | head -1
          }

          run_case contact     bare  '  contact = "x"' \
                   '[params.contact] must be a table'
          run_case footer      bare  '  footer = "x"' \
                   '[params.footer] must be a table'
          run_case social      tail  '  [params.footer]\n    socialNetworks = "x"\n' \
                   '[params.footer.socialNetworks] must be a table'
          run_case skills      about '    skills = "x"' \
                   '[params.about.skills] must be a table'
          run_case skillitems  tail  '  [params.about.skills]\n    enable = true\n    items = "x"\n' \
                   '[params.about.skills] items must be a list'
          run_case projitems   tail  '  [params.projects]\n    items = "x"\n' \
                   '[params.projects] items must be a list'
          run_case projentries tail  '  [params.projects]\n    items = ["a", "b"]\n' \
                   '[params.projects] items ignored 2 of its entries'
          run_case expitems    tail  '  [params.experience]\n    items = "x"\n' \
                   '[params.experience] items must be a list'
          run_case expjobs     tail  '  [[params.experience.items]]\n    company = "ACME"\n    jobs = "x"\n' \
                   'jobs must be a list'
          # An entry with no company at all: the warning has to keep naming the
          # entry rather than degrading into printf's own error syntax, which is
          # what the log net above is watching for.
          run_case expnoname   tail  '  [[params.experience.items]]\n    jobs = "x"\n' \
                   'items "<unnamed>" jobs must be a list'
          # navbar is the one that reached every page: nav.html renders on all of
          # them, so this died on /categories rather than the home. sections.html
          # already guarded the same param for its showBlog gate — the two files
          # disagreed about [params.navbar] until both read through the helper.
          run_case navbar      bare  '  navbar = "x"' \
                   '[params.navbar] must be a table'
          # schema.html runs on every page, so a scalar here is the whole site
          # rather than one template. [params.aeo] gets the same assertion in
          # "Assert the AEO switches", where the fixture can set enableRobotsTXT
          # — without it robots.txt never renders and the param is never read.
          run_case schema      bare  '  schema = "x"' \
                   '[params.schema] must be a table'
          # The mirror direction: a scalar-shaped param written as a table. These
          # never reach a `range` or a field lookup — they reach plainify, relURL
          # and absURL, which cast to string and abort when the cast fails. All
          # three are read in head.html, so all three were whole-site failures.
          run_case description tail  '  [params.description]\n    a = 1\n' \
                   '[params.description] must be a single value'
          run_case favicon     tail  '  [params.favicon]\n    a = 1\n' \
                   '[params.favicon] must be a single value'
          run_case ogimage     tail  '  [params.ogImage]\n    a = 1\n' \
                   '[params.ogImage] must be a single value'
          # A table where a bare skill belongs. This one never aborted — it
          # rendered `map[a:1]` into a skill chip — but a helper that means
          # "entries are tables" in one mode and "entries are anything" in the
          # other is a helper nobody can reason about.
          run_case skillmaps   tail  '  [params.about.skills]\n    enable = true\n    items = ["Go", {a = 1}]\n' \
                   '[params.about.skills] items ignored 1 of its entries'
          # A post's own image, read by head.html for og:image and again by
          # single.html for the featured banner. Both go through a relURL/absURL
          # cast, so guarding one and not the other would tolerate the typo in
          # the <head> and still abort on the body of the same page.
          run_case pageimg     front '' \
                   'image in /terminal-mono/blogs/p/ must be a single value' \
                   'image:\n  a: 1'
          # markdownify and urlize cast to string too, so the same table that
          # merely looks wrong when printed aborts the moment it reaches one of
          # them. These four are per entry rather than per param, so the warning
          # names the entry — by repo, or by title once the title itself has been
          # through the guard.
          run_case aboutcontent content '    [params.about.content]\n      a = 1' \
                   '[params.about] content must be a single value'
          run_case projcontent tail  '  [params.projects]\n    [[params.projects.items]]\n      repo = "r"\n      [params.projects.items.content]\n        a = 1\n' \
                   '[params.projects] items "r" content must be a single value'
          run_case projtitle   tail  '  [params.projects]\n    [[params.projects.items]]\n      repo = "r"\n      [params.projects.items.title]\n        a = 1\n' \
                   '[params.projects] items "r" title must be a single value'
          run_case jobcontent  tail  '  [[params.experience.items]]\n    company = "C"\n    [[params.experience.items.jobs]]\n      name = "N"\n      [params.experience.items.jobs.content]\n        a = 1\n' \
                   '[params.experience] items "C" jobs "N" content must be a single value'
          # [params.theme] in each of the three wrong shapes. palettebool is here
          # rather than in the WARNS block for the printf-garbage net above: the
          # value reaches warnf, and %q on a non-string is exactly the defect
          # this harness was built to catch — `palette = 3` announced that the
          # requested palette was '\x03'.
          run_case theme       bare  '  theme = "x"' \
                   '[params.theme] must be a table'
          run_case palettetype tail  '  [params.theme]\n    [params.theme.palette]\n      a = 1\n' \
                   '[params.theme] palette must be a single value'
          run_case palettebool tail  '  [params.theme]\n    palette = true\n' \
                   'is not a palette this theme ships'
          run_case paletteint  tail  '  [params.theme]\n    palette = 3\n' \
                   'is not a palette this theme ships'
      # A green build only proves the templates ran, not what they emitted. Each
      # block below is one line of the README's config contract, asserted. The
      # blank-link check guards the direction none of them cover: an entry that
      # resolves to no label has to be dropped, never shipped as an <a> a screen
      # reader cannot announce.
      - name: Assert the menu drives the sections
        run: |
          python3 - <<'PY'
          import re, sys

          ATTR = r'(?:"([^"]*)"|\'([^\']*)\'|([^\s>]+))'
          SECTION = re.compile(r'<section\b([^>]*)>')
          IDS = re.compile(r'\bid=' + ATTR)
          CLASS = re.compile(r'\bclass=' + ATTR)
          NAV = re.compile(r'<nav class=["\']?nav["\']?[ >].*?</nav>', re.S)
          ANCHOR = re.compile(r'<a\b([^>]*)>(.*?)</a>', re.S)

          bad = []
          def check(name, got, want):
              if got == want:
                  print(f'  ok   {name}: {got}')
              else:
                  bad.append(f'{name}:\n    got  {got}\n    want {want}')
                  print(f'  FAIL {name}: {got} != {want}')

          def val(m):
              return next(g for g in m.groups() if g is not None)

          def read(fixture):
              return open(f'/tmp/{fixture}/public/index.html').read()

          def sections(html):
              out = []
              for m in SECTION.finditer(html):
                  i, c = IDS.search(m.group(1)), CLASS.search(m.group(1))
                  out.append((val(i) if i else '', val(c) if c else ''))
              # <section id="top"> is the hero: the page header, not a section.
              return [(i, c) for i, c in out if i != 'top']

          # Faults here go through `bad` like everything else rather than
          # sys.exit: aborting the run hides every assertion after this one, and
          # the first failure is rarely the only thing worth seeing.
          def nav(html, label='nav'):
              m = NAV.search(html)
              if not m:
                  bad.append(f'{label}: no <nav> in the output')
                  return []
              labels = []
              for attrs, text in ANCHOR.findall(m.group(0)):
                  if re.search(r'class=["\']?brand', attrs):
                      continue
                  labels.append(re.sub(r'<[^>]*>', '', text).strip())
              blank = [l for l in labels if not l]
              if blank:
                  bad.append(f'{label}: nav has {len(blank)} link(s) with no text')
              # Desktop bar and mobile menu render the same partial, hence twice.
              half = len(labels) // 2
              if labels[:half] != labels[half:]:
                  bad.append(f'{label}: desktop bar {labels[:half]} and '
                             f'mobile menu {labels[half:]} disagree')
              return labels[:half]

          def nav_hrefs(html):
              m = NAV.search(html)
              out = []
              for attrs in re.findall(r'<a\b([^>]*)>', m.group(0) if m else ''):
                  if re.search(r'class=["\']?brand', attrs):
                      continue
                  h = re.search(r'\bhref=' + ATTR, attrs)
                  out.append(val(h) if h else '')
              return out[:len(out) // 2]

          def hero_cta(html):
              return bool(re.search(r'<a[^>]*class=["\']?btn[^>]*#projects', html) or
                          re.search(r'<a[^>]*#projects[^>]*class=["\']?btn', html))

          def last(html):
              secs = sections(html)
              marked = [i for i, c in secs if 'section--last' in c]
              return marked, ([secs[-1][0]] if secs else [])

          # A site that configures nothing renders no sections — so it must offer
          # no way to reach one. This is the defect the release exists to fix: the
          # v0.3.0 bare site shipped four anchors that went nowhere.
          html = read('bare')
          check('bare sections', [i for i, _ in sections(html)], [])
          check('bare nav', nav(html, 'bare'), [])
          check('bare hamburger', 'hamburger' in html, False)
          check('bare mobile menu', 'mobile-menu' in html, False)
          check('bare hero CTA', hero_cta(html), False)
          check('bare section--last', *last(html))

          # No menu: the v0.3.0 defaults, which differ from each other and stay
          # that way. This is the upgrade promise for every site out there today.
          html = read('fallback')
          check('fallback sections', [i for i, _ in sections(html)],
                ['projects', 'about', 'experience', 'contact'])
          check('fallback nav', nav(html, 'fallback'), ['about', 'projects', 'experience', 'contact'])
          check('fallback section--last', *last(html))
          # The one fixture that renders `projects`, and so the only one that can
          # assert the hero CTA is *there*. Without it every hero_cta() call in
          # this file expects False and a broken regex would pass all of them.
          check('fallback hero CTA', hero_cta(html), True)

          # The headline claim: one menu, one order, in one build.
          html = read('custom')
          check('custom sections', [i for i, _ in sections(html)],
                ['contact', 'about', 'experience'])
          check('custom nav', nav(html, 'custom'), ['contact', 'experience'])
          check('custom section--last', *last(html))
          check('custom hero CTA', hero_cta(html), False)

          # The escape hatch, for a site that wants the two lists to disagree.
          html = read('hatch')
          check('hatch sections', [i for i, _ in sections(html)],
                ['contact', 'about', 'experience'])
          check('hatch nav', nav(html, 'hatch'), ['about', 'contact'])
          check('hatch section--last', *last(html))

          # enable is a veto, never a summons — both halves, one fixture.
          html = read('toggle')
          check('toggle sections', [i for i, _ in sections(html)], ['about', 'contact'])
          check('toggle nav', nav(html, 'toggle'), ['about', 'contact'])
          check('toggle section--last', *last(html))
          check('toggle hero CTA', hero_cta(html), False)

          # Menus and enable are language-scoped, and the two languages must be
          # able to disagree about which sections exist. projects is off for the
          # whole site, experience only for PT.
          en = read('i18n')
          pt = open('/tmp/i18n/public/pt/index.html').read()
          check('i18n EN sections', [i for i, _ in sections(en)],
                ['about', 'experience', 'contact'])
          check('i18n PT sections', [i for i, _ in sections(pt)], ['about', 'contact'])
          check('i18n EN section--last', *last(en))
          check('i18n PT section--last', *last(pt))

          # A menu naming no section renders no section — and says so. The nav
          # keeps the blog, which was never a section to begin with.
          html = read('orphan')
          check('orphan sections', [i for i, _ in sections(html)], [])
          check('orphan nav', nav(html, 'orphan'), ['blog'])
          check('orphan hero CTA', hero_cta(html), False)

          # A mismatched anchor is a typo with exactly one possible fix, so the
          # link is repaired rather than shipped broken. This fixture is in the
          # dead-anchor sweep below for the same reason.
          html = read('invalid-anchor')
          check('invalid-anchor sections', [i for i, _ in sections(html)], ['about'])
          check('invalid-anchor href', [h for h in nav_hrefs(html) if '#' in h],
                ['/terminal-mono/#about'])

          for f in ['unknown', 'dup', 'type', 'empty', 'scalar', 'list']:
              check(f'invalid-{f} falls back', [i for i, _ in sections(read(f'invalid-{f}'))],
                    ['projects', 'about', 'experience', 'contact'])

          if bad:
              sys.exit('\n' + '\n'.join(bad))
          print('the menu drives the sections')
          PY
      # The check that closes the defect for good, on every page of every build:
      # no link may point at an anchor that is not on the page it targets.
      # Fragments resolve against the target, not the page the link sits on — the
      # nav on a blog post points at the home's anchors — and the baseURL
      # sub-path has to come off before anything can be compared. Run against
      # v0.3.0's bare output this reports 17 dead anchors, which is the reason it
      # exists. Every fixture is in, invalid-anchor included: a mismatched anchor
      # is repaired rather than shipped, so there is no longer a build in this
      # workflow that is allowed to contain a dead one.
      - name: Assert no link points at an anchor that is not there
        run: |
          python3 - <<'PY'
          import os, re, sys

          ATTR = r'(?:"([^"]*)"|\'([^\']*)\'|([^\s>]+))'
          IDS = re.compile(r'\bid=' + ATTR)
          ANCHOR = re.compile(r'<a\b([^>]*)>', re.S)
          HREF = re.compile(r'\bhref=' + ATTR)
          PREFIX = '/terminal-mono/'

          bad = []

          def val(m):
              return next(g for g in m.groups() if g is not None)

          def sweep(label, public):
              pages = {}
              for dirpath, _, names in os.walk(public):
                  for n in names:
                      if not n.endswith('.html'):
                          continue
                      path = os.path.join(dirpath, n)
                      body = open(path).read()
                      rel = os.path.relpath(path, public)
                      key = '' if rel == 'index.html' else (
                          rel[:-len('/index.html')] if rel.endswith('/index.html') else rel)
                      pages[key] = (body, {val(m) for m in IDS.finditer(body)})

              checked = 0
              for key, (body, _) in sorted(pages.items()):
                  for attrs in ANCHOR.findall(body):
                      h = HREF.search(attrs)
                      if not h:
                          continue
                      href = val(h)
                      if '#' not in href or href.startswith(('http://', 'https://', 'mailto:', 'tel:')):
                          continue
                      path, _, frag = href.partition('#')
                      if not frag:
                          continue
                      if path.startswith('/'):
                          if not path.startswith(PREFIX):
                              bad.append(f'{label}: {href!r} on /{key} escapes {PREFIX}')
                              continue
                          target = path[len(PREFIX):].strip('/')
                      elif path == '':
                          target = key
                      else:
                          target = os.path.normpath(os.path.join(key, path)).strip('/')
                          target = '' if target == '.' else target
                      if target not in pages:
                          bad.append(f'{label}: {href!r} on /{key} targets a page that was not built')
                          continue
                      if frag not in pages[target][1]:
                          bad.append(f'{label}: {href!r} on /{key} points at #{frag}, '
                                     f'which is not on /{target or "(home)"}')
                      checked += 1
              print(f'  {label}: {checked} fragment link(s) over {len(pages)} page(s)')
              # Without a floor this whole sweep degrades to a green no-op the
              # moment the markup moves out from under the regexes above — and it
              # is the assertion the release is named for. Every page that renders
              # the site chrome opens with a skip-link to #main, so counting the
              # pages that carry one gives a floor that calibrates itself. Pages
              # without it are the alias stubs Hugo writes for pagination: 273
              # bytes of meta-refresh, no <a> at all.
              floor = sum(1 for body, _ in pages.values() if '#main' in body)
              if not floor:
                  bad.append(f'{label}: no page carries the skip-link — nothing was swept')
              elif checked < floor:
                  bad.append(f'{label}: {checked} fragment link(s) over {floor} page(s) that '
                             'carry one — the sweep is not seeing the markup')

          sweep('exampleSite', 'exampleSite/public')
          for f in ['bare', 'fallback', 'custom', 'hatch', 'i18n',
                    'toggle', 'orphan', 'invalid-anchor']:
              sweep(f, f'/tmp/{f}/public')

          if bad:
              sys.exit('\n'.join(bad))
          print('every fragment link reaches its anchor')
          PY
      # The hero terminal's post listing is built server-side into data-posts and
      # only becomes visible once JS types it out, so a rendering bug here is
      # invisible to a build that merely succeeds. Four fixtures, one per shape
      # the terminal can take: the exampleSite carries every command with
      # per-language URLs, bare carries none, toggle loses one to the index, and
      # orphan loses two while listing a single post. Each also holds the height
      # it reserves to the commands it emitted.
      - name: Assert the hero post listing
        run: |
          python3 - <<'PY'
          import html as htmllib, json, re, sys

          ATTR = r'("[^"]*"|\'[^\']*\'|[^\s>]+)'

          def hero(path):
              raw = open(path).read()
              pre = re.search(r'<pre id=["\']?hero-term["\']?[ >][^>]*>', raw)
              if not pre:
                  sys.exit(f'{path}: no #hero-term in the output')
              tag = pre.group(0)
              attr = re.search(r'data-posts=' + ATTR, tag)
              if not attr:
                  sys.exit(f'{path}: #hero-term has no data-posts attribute')
              return tag, json.loads(htmllib.unescape(attr.group(1).strip('"\'')))

          def data(tag, name):
              m = re.search(r'\b' + name + '=' + ATTR, tag)
              return htmllib.unescape(m.group(1).strip('"\'')) if m else ''

          # terminal.js types a command only when it has output, so the height the
          # box reserves depends on which commands the template emitted. Recompute
          # the count from the tag's own data-* and hold --hero-lines to it: the
          # template does this arithmetic in Go, this does it again in Python, and
          # an off-by-a-command shows up as a mismatch rather than as dead space
          # under the hero that no test can see.
          # Both sides count logical lines, which is the number the reader gets
          # before terminal.js runs and without it. The script measures the box
          # and adds what wrapping costs; nothing here renders at a width, so a
          # wrap is invisible to this check by construction — that half is
          # covered in scripts/test_terminal_js.js.
          def lines(path, tag, posts):
              want = 4
              if data(tag, 'data-stack'):
                  want += 3
              if data(tag, 'data-projects'):
                  want += 3
              if posts:
                  want += 2 + len(posts)
              got = re.search(r'--hero-lines:\s*(\d+)', tag)
              if not got:
                  sys.exit(f'{path}: #hero-term has no --hero-lines to reserve its height with')
              if int(got.group(1)) != want:
                  sys.exit(f'{path}: --hero-lines is {got.group(1)}, but the commands '
                           f'emitted add up to {want} lines')
              if 'term__body--posts' in tag or '--hero-posts' in tag:
                  sys.exit(f'{path}: still carries the retired --hero-posts/term__body--posts pair')
              return want

          seen = {}
          for path, lang in [
              ('exampleSite/public/index.html', 'en'),
              ('exampleSite/public/pt/index.html', 'pt'),
          ]:
              tag, posts = hero(path)
              if not posts:
                  sys.exit(f'{path}: the exampleSite has posts but {lang} listed none')
              # All three commands plus three posts: 4 + 3 + 3 + (2 + 3).
              if lines(path, tag, posts) != 15:
                  sys.exit(f'{path}: the exampleSite fills everything in, so its terminal is 15 lines')
              for p in posts:
                  # Language scoping asserted as a property, not against a literal
                  # baseURL, so changing the CI --baseURL cannot fail this falsely.
                  in_pt = '/pt/' in p.get('u', '')
                  if in_pt != (lang == 'pt'):
                      sys.exit(f'{path}: {lang} post URL {p.get("u")!r} is scoped to the wrong language')
                  if not re.fullmatch(r'\d{4}-\d{2}-\d{2}', p.get('d', '')):
                      sys.exit(f'{path}: bad date {p.get("d")!r}')
                  if not p.get('f', '').endswith('.md'):
                      sys.exit(f'{path}: bad filename {p.get("f")!r}')
                  if not p.get('t'):
                      sys.exit(f'{path}: {p.get("f")!r} has no title for its accessible name')
              dates = [p['d'] for p in posts]
              if dates != sorted(dates, reverse=True):
                  sys.exit(f'{path}: posts are not newest-first: {dates}')
              seen[lang] = [p['f'] for p in posts]
              print(f'{lang} hero listing OK: {seen[lang]}')

          # The filename is built from the title, so a translated post must not
          # reuse the English name — the bug that made the PT home read English.
          if seen['en'] == seen['pt']:
              sys.exit(f'PT listing is identical to EN ({seen["pt"]}) — names are not following the language')

          # A site that fills nothing in has nothing for two of the three commands
          # to print, so it must not type them — and must not reserve their lines.
          # Four: whoami, its output, the blank after it, and the closing prompt.
          tag, posts = hero('/tmp/bare/public/index.html')
          if posts:
              sys.exit(f'bare site has no content but listed {posts}')
          for attr in ['data-stack', 'data-projects']:
              if data(tag, attr):
                  sys.exit(f'bare site has no content but {attr} carries {data(tag, attr)!r}')
          if lines('/tmp/bare/public/index.html', tag, posts) != 4:
              sys.exit('bare site reserves lines for commands it will not type')
          print('bare hero listing OK: empty, no height reserved')

          # The switch has to reach the terminal, not stop at the section: toggle
          # keeps projects out of the index, so `ls projects/` loses its output and
          # the reserved height drops the three lines that went with it.
          tag, posts = hero('/tmp/toggle/public/index.html')
          if data(tag, 'data-projects'):
              sys.exit(f'toggle: projects is not in the index, but the terminal still lists '
                       f'{data(tag, "data-projects")!r}')
          if not data(tag, 'data-stack'):
              sys.exit('toggle: about is in the index and has skills, so cat stack.txt should render')
          if lines('/tmp/toggle/public/index.html', tag, posts) != 7:
              sys.exit('toggle: dropping ls projects/ should take its three lines with it')
          print('toggle hero listing OK: ls projects/ gone with its section')

          # Every fixture above lists three posts or none, so a per-post term
          # hardcoded to 3 would satisfy all of them and the listing would only
          # reserve the right height on a site with exactly three posts. orphan is
          # the fixture that varies it: its menu names no section, so both other
          # commands go, and its single post makes the block 2 + 1 rather than
          # 2 + 3. It is also the other half of toggle — the index removing a
          # command, asserted from the side where it removes two.
          tag, posts = hero('/tmp/orphan/public/index.html')
          if len(posts) != 1:
              sys.exit(f'orphan: the per-post term is pinned by its single post, but it listed {len(posts)}')
          for attr in ['data-stack', 'data-projects']:
              if data(tag, attr):
                  sys.exit(f'orphan: the menu names no section, but {attr} carries {data(tag, attr)!r}')
          if lines('/tmp/orphan/public/index.html', tag, posts) != 7:
              sys.exit('orphan: one post reserves 2 + 1 lines for the listing, not 2 + 3')
          print('orphan hero listing OK: one post, both other commands gone with their sections')
          PY
      # The hero and the blog cards share partials/post-filename.html precisely so
      # they cannot name the same post differently. Both sides get checked, and
      # both must differ between languages — a name taken from the file on disk
      # loses its language suffix and reads English everywhere.
      - name: Assert blog card names follow the language
        run: |
          python3 - <<'PY'
          import re, sys

          def paths(path):
              found = re.findall(r'<span class=["\']?card__path["\']?>([^<]*)</span>',
                                 open(path).read())
              if not found:
                  sys.exit(f'{path}: no card paths found')
              return found

          en = paths('exampleSite/public/blogs/index.html')
          pt = paths('exampleSite/public/pt/blogs/index.html')

          if len(en) != len(pt):
              sys.exit(f'EN lists {len(en)} cards, PT lists {len(pt)}')
          for a, b in zip(en, pt):
              if a == b:
                  sys.exit(f'card name {a!r} is identical in both languages — '
                           'names are coming from the file, not the title')
          for p in en + pt:
              if not p.startswith('~/blog/') or not p.endswith('.md'):
                  sys.exit(f'card path {p!r} lost its ~/blog/….md shape')
          print(f'card names OK: en={en[0]!r} pt={pt[0]!r}')
          PY
      # Hugo orders pages by Weight before Date, so a site that weights its posts
      # used to get the OLDEST three from `--latest`, with the newest unweighted
      # post dropped past the cut. The exampleSite sets no weights, so the
      # newest-first check above can never catch a regression here on its own.
      - name: Assert --latest ignores weight and follows date
        run: |
          set -e
          mkdir -p /tmp/weighted/themes /tmp/weighted/content/blogs
          ln -sfn "$GITHUB_WORKSPACE" /tmp/weighted/themes/terminal-mono
          printf 'baseURL = "https://example.com/"\ntitle = "Weighted"\ntheme = "terminal-mono"\n' > /tmp/weighted/hugo.toml
          printf -- '---\ntitle: "Old"\ndate: 2020-01-01\nweight: 1\n---\nx\n'      > /tmp/weighted/content/blogs/old.md
          printf -- '---\ntitle: "Mid"\ndate: 2023-06-06\nweight: 5\n---\nx\n'      > /tmp/weighted/content/blogs/mid.md
          printf -- '---\ntitle: "Newest"\ndate: 2026-08-01\nweight: 9\n---\nx\n'   > /tmp/weighted/content/blogs/newest.md
          printf -- '---\ntitle: "Second"\ndate: 2026-07-01\n---\nx\n'              > /tmp/weighted/content/blogs/second.md
          hugo --source /tmp/weighted --gc --minify --panicOnWarning
          python3 - <<'PY'
          import html as htmllib, json, re, sys

          raw = open('/tmp/weighted/public/index.html').read()
          tag = re.search(r'<pre id=["\']?hero-term["\']?[ >][^>]*>', raw).group(0)
          attr = re.search(r'data-posts=("[^"]*"|\'[^\']*\'|[^\s>]+)', tag).group(1)
          posts = json.loads(htmllib.unescape(attr.strip('"\'')))

          got = [p['d'] for p in posts]
          want = ['2026-08-01', '2026-07-01', '2023-06-06']
          if got != want:
              sys.exit(f'--latest is not date-ordered on a weighted site:\n  got  {got}\n  want {want}')
          print(f'weighted-site order OK: {got}')
          PY
