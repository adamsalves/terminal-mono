# Builds the bundled exampleSite on every pull request, so a broken template
# never reaches main — where pages.yml deploys the demo automatically.
# Deliberately kept separate from pages.yml: a PR check needs none of the Pages
# machinery (configure-pages, the pages concurrency group, pages:write).
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Successive pushes to the same PR supersede each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.163.3
      HUGO_ENV: production
      TZ: UTC
    steps:
      - name: Install Hugo (extended)
        run: |
          wget -O /tmp/hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # for .GitInfo / .Lastmod
      - name: Inject theme into exampleSite
        run: |
          mkdir -p exampleSite/themes
          ln -sfn "$GITHUB_WORKSPACE" exampleSite/themes/terminal-mono
      - name: Build exampleSite
        run: hugo --source exampleSite --gc --minify --baseURL "https://example.com/"
