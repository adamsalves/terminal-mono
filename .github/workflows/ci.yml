# Builds the bundled exampleSite on every pull request, so a broken template
# never reaches main — where pages.yml deploys the demo automatically.
# Deliberately kept separate from pages.yml: a PR check needs none of the Pages
# machinery (configure-pages, the pages concurrency group, pages:write).
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Successive pushes to the same PR supersede each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # The release tooling merges to main and pushes tags, so its logic is gated
  # here rather than discovered during a release. The suite reads the real
  # CHANGELOG.md, which means the release PR — whose only change is that file —
  # validates its own promoted changelog before it can merge.
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test the release tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 0.158.0 is the min_version declared in theme.toml — without building
        # against it, that promise to consumers is never actually checked.
        # Keep 0.163.3 in sync with pages.yml and netlify.toml.
        hugo-version: ['0.158.0', '0.163.3']
    env:
      HUGO_VERSION: ${{ matrix.hugo-version }}
      HUGO_ENV: production
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Hugo (extended)
        run: |
          wget -O /tmp/hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
      - name: Inject theme into exampleSite
        run: |
          mkdir -p exampleSite/themes
          ln -sfn "$GITHUB_WORKSPACE" exampleSite/themes/terminal-mono
      # Build under a sub-path: the demo is served from one, and under a root
      # baseURL the nav/404 sub-path handling renders identically whether or
      # not it is correct (see 33a5de8), leaving that path unexercised.
      - name: Build exampleSite
        run: |
          hugo --source exampleSite --gc --minify \
            --printI18nWarnings --panicOnWarning \
            --baseURL "https://example.com/terminal-mono/"
      # The exampleSite fills in every param; a fresh consumer fills in none.
      # That path broke once already (see 41451a3), and the exampleSite build
      # stays green through it.
      - name: Build a bare site (no params) against the theme
        run: |
          mkdir -p /tmp/bare/themes
          ln -sfn "$GITHUB_WORKSPACE" /tmp/bare/themes/terminal-mono
          printf 'baseURL = "https://example.com/terminal-mono/"\ntitle = "Bare Site"\ntheme = "terminal-mono"\n' > /tmp/bare/hugo.toml
          hugo --source /tmp/bare --gc --minify --panicOnWarning
      # A green build only proves the templates ran, not what they emitted. The
      # bare site is where the nav's fallback order lives — the promise that a
      # site with no [[menu.main]] upgrades untouched — so assert it rather than
      # trust it. The blank-link check guards the other direction: an entry that
      # resolves to no label has to be dropped, never shipped as an <a> a screen
      # reader cannot announce.
      - name: Assert the fallback nav
        run: |
          python3 - <<'PY'
          import re, sys

          html = open('/tmp/bare/public/index.html').read()
          nav = re.search(r'<nav class=["\']?nav["\']?[ >].*?</nav>', html, re.S)
          if not nav:
              sys.exit('no <nav> in the bare site output')

          links = re.findall(r'<a\b[^>]*>(.*?)</a>', nav.group(0), re.S)
          blank = [l for l in links if not re.sub(r'<[^>]*>|\s', '', l)]
          if blank:
              sys.exit(f'nav has {len(blank)} link(s) with no text: {blank}')

          # Desktop bar and mobile menu render the same partial, hence twice.
          expected = ['about', 'projects', 'experience', 'contact'] * 2
          found = [l for l in links if l in set(expected)]
          if found != expected:
              sys.exit(f'fallback nav order changed:\n  found    {found}\n  expected {expected}')

          print(f'fallback nav OK: {found}')
          PY
