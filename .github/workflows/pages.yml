# Builds the bundled exampleSite and deploys it to GitHub Pages.
name: Deploy demo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Keep in sync with ci.yml and netlify.toml — if the PR check and the
      # deploy build on different versions, the check stops guarding the deploy.
      HUGO_VERSION: 0.163.3
      HUGO_ENV: production
      TZ: UTC
    steps:
      - name: Install Hugo (extended)
        run: |
          wget -O /tmp/hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # for .GitInfo / .Lastmod
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Inject theme into exampleSite
        run: |
          mkdir -p exampleSite/themes
          ln -sfn "$GITHUB_WORKSPACE" exampleSite/themes/terminal-mono
      - name: Build exampleSite
        run: hugo --source exampleSite --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: exampleSite/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
