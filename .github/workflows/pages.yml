# Builds the bundled exampleSite and deploys it to GitHub Pages.
name: Deploy demo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Keep in sync with ci.yml and netlify.toml — if the PR check and the
      # deploy build on different versions, the check stops guarding the deploy.
      HUGO_VERSION: 0.163.3
      HUGO_ENV: production
      TZ: UTC
    steps:
      - name: Install Hugo (extended)
        run: |
          wget -O /tmp/hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # for .GitInfo / .Lastmod
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Inject theme into exampleSite
        run: |
          mkdir -p exampleSite/themes
          ln -sfn "$GITHUB_WORKSPACE" exampleSite/themes/terminal-mono
      - name: Build exampleSite
        run: hugo --source exampleSite --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      # The structural half of the AEO check, run on the bytes that are about to
      # be deployed. This one is authoritative: it reads the build, so it sees
      # the demo's own robots.txt, llms.txt and markdown twins rather than
      # whatever happens to sit at the host root.
      - name: Check the AEO output
        run: python3 scripts/check_aeo.py exampleSite/public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: exampleSite/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  # Informational, never blocking, and worth reading with its limits in mind —
  # which is why they are printed next to the score rather than left for someone
  # to rediscover.
  #
  # Its own job, with no permissions at all, because the step runs a third-party
  # npm package: inside `deploy` it inherited pages:write and id-token:write, so
  # a bad release of that package would have run with a token that can publish to
  # this site. The version is pinned for the same reason — `npx -y aeo.js` fetches
  # whatever is newest at the moment the workflow runs. Nothing here gates the
  # deploy, which already happened in the job above.
  #
  # aeo.js scans `new URL(target).origin`: for a project site published under a
  # path it fetches robots.txt, llms.txt and sitemap.xml from the *host root*,
  # which belongs to no deploy of this theme. Its HTML regexes also require quoted
  # attributes, and `hugo --minify` emits valid unquoted HTML5 — so canonical and
  # JSON-LD read as absent whatever is on the page. Both are upstream bugs, both
  # are filed under limitations below, and both mean the number here is a floor
  # and not a measurement.
  score:
    needs: deploy
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: AEO score (informational)
        continue-on-error: true
        env:
          # Pinned: bump deliberately, after reading what changed.
          AEO_JS_VERSION: '0.0.16'
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -uo pipefail
          url="$PAGE_URL"
          path=$(printf '%s' "$url" | sed -E 's|https?://[^/]+||')
          {
            echo "## AEO"
            echo
            echo "Scanned \`$url\` with \`npx aeo.js@$AEO_JS_VERSION check\`."
            echo
            if [ -n "${path%/}" ]; then
              echo "> **This score is not the theme's.** aeo.js scans the host root, and"
              echo "> this demo is published under \`$path\`. Its robots.txt, llms.txt and"
              echo "> sitemap.xml checks are reading files that belong to another site."
              echo
            fi
            echo "> Its HTML checks require quoted attributes and this build is minified,"
            echo "> so canonical and JSON-LD read as absent regardless of the page."
            echo
            echo '```'
            npx -y "aeo.js@$AEO_JS_VERSION" check "$url" 2>&1 | head -40 || echo "(the checker did not run)"
            echo '```'
            echo
            echo "The authoritative check is \`scripts/check_aeo.py\`, run on the build in the job above."
          } >> "$GITHUB_STEP_SUMMARY"
