# Publishes the GitHub Release when a vX.Y.Z tag is pushed, with the matching
# CHANGELOG section as the notes.
#
# A git tag and a GitHub Release are different objects: the sidebar and the
# "Latest" badge read the Release, not the tag. Creating it by hand is easy to
# forget — v0.1.0 and v0.2.2 were both tagged and left unreleased — so this
# makes the tag push the only step that matters.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needs the tag history to find the previous version

      # Same script you can run locally to preview the body, so the logic that
      # builds the notes is not stranded inside this YAML where it never gets
      # exercised until a tag is already pushed.
      - name: Build the release notes from CHANGELOG.md
        run: |
          python3 scripts/release-notes.py "${GITHUB_REF_NAME#v}" | tee release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --latest \
            --verify-tag
