baseURL = "https://example.com/"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false   # en at /, pt at /pt/
theme = "terminal-mono"
enableRobotsTXT = true
enableEmoji = true
summaryLength = 30

[pagination]
  pagerSize = 5

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = false
    tabWidth = 2
    guessSyntax = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

# ============================================================
#  Shared (non-translatable) params — merged into every language.
# ============================================================
# ============================================================
#  Nav menu — optional, and the page's index. This menu sets the order of the
#  nav links AND the order the home page renders its sections in. Reordering
#  here moves the sections; deleting an entry removes the section along with
#  its link.
#
#  Delete the whole block and the theme falls back to what it did before the
#  two were connected: the nav in its own default order (about, projects,
#  experience, blog, contact) and the page in the layout's (projects, about,
#  experience, contact). The two defaults are different lists, and defining a
#  menu is what makes them agree.
#
#  Ordered by `weight`. One block serves every language: the `identifier` is
#  used as an i18n key, so "about" renders as "about" in English and "sobre"
#  in Portuguese without repeating the menu per language.
#
#  Set `name` to override the label with a literal string — it always wins
#  over the translation, and disables translation for that entry.
#
#  Known sections are about, projects, experience and contact. Any other
#  identifier (blog, an external link) is nav-only. The hero is the page's
#  header, not a section: it is always first.
#
#  Two more switches, both commented out here so the demo stays put:
#
#    [menu.main.params]
#      showInNav = false      # keep the section, drop only its nav link
#
#    [params.sections]
#      order = ["about", "projects", "experience", "contact"]
#                             # the escape hatch: this wins for the page while
#                             # the nav keeps following the menu
#
#  And per section, [params.<section>] enable = false turns one off without
#  touching the menu — see [params.experience] far below, which sets it to
#  true. That is now the default for every section, so the line is redundant;
#  it is kept because it is the natural place to flip to false.
# ============================================================
[[menu.main]]
  identifier = "projects"
  url = "#projects"        # anchors resolve against the language's home
  weight = 10
[[menu.main]]
  identifier = "about"
  url = "#about"
  weight = 20
[[menu.main]]
  identifier = "experience"
  url = "#experience"
  weight = 30
[[menu.main]]
  identifier = "blog"
  pageRef = "/blogs"       # pageRef, not url: it resolves per language, so PT
                           # links to /pt/blogs/. A url = "/blogs/" would send
                           # every language to the English section.
                           # Still hidden when the language has no posts.
  weight = 40
[[menu.main]]
  identifier = "contact"
  url = "#contact"
  weight = 50

[params]
  showScanlines = true       # CRT scanline overlay
  readingProgress = true     # reading-progress bar on posts

  # ============================================================
  #  Palette — the whole site's colors, chosen here rather than by
  #  editing the theme's CSS. Five ship:
  #
  #    lime       green phosphor — the default, and what every
  #               earlier version of the theme rendered
  #    amber      the other CRT phosphor; the ground goes warm too
  #    cyberpunk  neon magenta with cyan prompts, on violet-black
  #    ice        cold cyan on slate; an editor rather than a CRT
  #    mono       no hue at all — white phosphor on true black
  #
  #  Build time, not runtime: the published site has one palette.
  #  All five are dark — the theme is dark-only by design.
  #
  #  [params.theme.colors] goes on top of whichever palette won, so
  #  a site can start from one and change only what it wants. The
  #  keys are bg, surface, surface2, surface3, border, borderSoft,
  #  borderFaint, text, soft, prose, muted, muted2, dim, dim2,
  #  accent, accentDim, danger, and codeKey/codeType/codeStr/codeNum
  #  for the syntax highlighting. Case and punctuation don't matter:
  #  accentDim, accentdim and accent-dim are the same key.
  #
  #  Commented out so the demo ships in lime. An unknown palette
  #  name, or a key not on that list, warns and is ignored — it
  #  never takes the build down.
  # ============================================================
  # [params.theme]
  #   palette = "cyberpunk"
  #   [params.theme.colors]
  #     accent = "#00ffd5"
  terminalUser = "robin@portfolio"
  allowIndexing = true       # allow indexing even outside production
  # Both paths are relative to the baseURL, and written without a leading
  # slash on purpose: a rooted "/img/og.png" is rooted at the *host*, so on a
  # site published under a sub-path — this demo is one — it resolves outside
  # the site and 404s in silence. The theme trims the slash for you either
  # way; write the absolute URL when you really do mean the host root.
  # favicon = "favicon.svg" # the theme ships a favicon; set to override
  # ogImage = "img/og.png"  # default image for Open Graph/Twitter
  # twitter = "robinvale"    # handle (without @) for twitter:site

  # ============================================================
  #  Fonts — JetBrains Mono ships with the theme, in static/fonts/,
  #  so nothing is fetched from fonts.googleapis.com. Two subsets are
  #  declared: latin, which is preloaded, and latin-ext, which is not.
  #
  #  Both are always published, and latin-ext costs a site nothing:
  #  it carries a unicode-range, so a browser requests it only for a
  #  page that actually contains one of those codepoints. This demo
  #  is English and Portuguese, and never does.
  #
  #  Turn it on if the site writes mostly in Polish, Czech, Turkish,
  #  Romanian or Hungarian — it adds the second <link rel=preload>,
  #  which moves that file into the first round trip instead of
  #  waiting for the stylesheet to be parsed and matched.
  # ============================================================
  # [params.fonts]
  #   latinExt = true

  [params.navbar]
    brandName = "robin.dev"
    # showBlog = true   # force the nav blog link on/off; default is auto (shown when the language has posts)

  [params.hero]
    # How many of the newest posts the hero terminal lists, as a fourth command
    # (`ls ~/blog --latest`). Set 0 to drop the command entirely. Nothing to turn
    # on: the listing appears once a language has posts and disappears when it
    # has none, and each language lists its own.
    latestPosts = 3

  [params.hero.socialLinks]
    [[params.hero.socialLinks.fontAwesomeIcons]]
      icon = "fab fa-github"
      url = "https://github.com/robinvale"
    [[params.hero.socialLinks.fontAwesomeIcons]]
      icon = "fab fa-linkedin-in"
      url = "https://linkedin.com/in/robinvale"

  [params.about.skills]
    enable = true
    items = ["JavaScript", "Vue.js", "React", "HTML5", "CSS3", "SASS", "GraphQL", "TypeScript"]

  [params.footer]
    copyright = "robin.dev"
    [params.footer.socialNetworks]
      github = "https://github.com/robinvale"
      linkedin = "https://linkedin.com/in/robinvale"

# ============================================================
#  English (default) — text is illustrative; swap in your data.
# ============================================================
[languages.en]
  label = "English"
  locale = "en-US"
  weight = 1
  title = "Robin Vale"

  [languages.en.params]
    title = "Robin Vale"
    description = "Front-End developer based in Berlin — JavaScript, Vue.js and React. I build interfaces that work well and are pleasant to use."

    [languages.en.params.hero]
      intro = "hi, my name is"
      subtitle = "Front-End Developer"
      location = "Berlin, Germany"
      content = "I build interfaces that work well and are pleasant to use, with JavaScript (ES6+), Vue.js and React. Based in Berlin, Germany."

    [languages.en.params.about]
      content = """
I'm a Front-End developer based in Berlin, Germany. I work on projects built with JavaScript (ES6+) and tools like Vue.js, React, HTML5, CSS3 and SASS. I enjoy learning and experimenting with new technologies.

Right now I'm sharpening my skills in React, GraphQL and testing (TDD) in JavaScript. In my free time I enjoy video games, sports (football, basketball and cycling) and music."""

    [languages.en.params.contact]
      title = "Let's talk?"
      content = "My inbox is always open. Whether you have a question or just want to say hi, I'll do my best to get back to you!"
      btnName = "send email"
      btnLink = "mailto:hello@robin.dev"

    [languages.en.params.experience]
      enable = true
      [[languages.en.params.experience.items]]
        company = "Current Company"
        [[languages.en.params.experience.items.jobs]]
          name = "Front-End Developer"
          date = "Jan 2023 — present"   # optional: omit for roles with no specific period
          content = "Building interfaces with Vue.js and React, focused on performance, accessibility and design systems."
      [[languages.en.params.experience.items]]
        company = "Previous Company"
        [[languages.en.params.experience.items.jobs]]
          name = "Junior Front-End Developer"
          date = "2021 — 2022"
          content = "Componentized screens, integrated REST/GraphQL APIs and wrote automated tests."

    [languages.en.params.projects]
      [[languages.en.params.projects.items]]
        title = "Trailhead"
        repo = "trailhead"
        language = "Vue / Nuxt"
        tagline = "collaborative trail map for hikers"
        content = "Find hiking groups by region, day, time, level and pace on an interactive map. Migrated to Nuxt 3 with a *wayfinding* redesign and two themes (light/dark)."
        badges = ["nuxt", "vue", "leaflet", "graphql", "typescript"]
        [languages.en.params.projects.items.featured]
          name = "demo"
          link = "https://trailhead.example"
        [[languages.en.params.projects.items.links]]
          icon = "fab fa-github"
          url = "https://github.com/robinvale/trailhead"
      [[languages.en.params.projects.items]]
        title = "Neon Drift"
        repo = "neon-drift"
        language = "TypeScript"
        tagline = "retro 8-bit arcade game"
        content = "Collect coins, dodge specters and clear stages. Arcade physics, chiptune audio generated via the Web Audio API and CRT screen effects."
        badges = ["phaser3", "typescript", "vite", "tailwind"]
        [[languages.en.params.projects.items.links]]
          icon = "fab fa-github"
          url = "https://github.com/robinvale/neon-drift"
      [[languages.en.params.projects.items]]
        title = "Sprint Deck"
        repo = "sprint-deck"
        language = "Vue 3"
        tagline = "real-time planning poker for agile teams"
        content = "Interactive table with live voting over WebSockets, customizable decks, consensus stats and history with charts."
        badges = ["vue3", "socketio", "pinia", "typescript"]
        [[languages.en.params.projects.items.links]]
          icon = "fab fa-github"
          url = "https://github.com/robinvale/sprint-deck"

