# Hugo theme metadata — "Terminal Mono"
# Theme folder: themes/terminal-mono/  →  in config: theme = "terminal-mono"

name = "Terminal Mono"
license = "MIT"
# …for the theme. static/fonts/*.woff2 is JetBrains Mono under the SIL Open
# Font License 1.1 — see LICENSE and static/fonts/OFL.txt.
licenselink = "https://github.com/adamsalves/terminal-mono/blob/main/LICENSE"
description = "Personal dark/mono theme for portfolio + blog. Animated terminal hero, repository-style cards, a blog with a reading-progress bar, tags and a 404 — all in the same aesthetic. Five built-in palettes (lime, amber, cyberpunk, ice, mono), switched from the config. No third-party JS dependencies."
homepage = "https://github.com/adamsalves/terminal-mono"
demosite = "https://adamsalves.github.io/terminal-mono/"

tags = ["portfolio", "blog", "dark", "minimal", "monospace", "personal", "developer", "terminal", "themeable", "color-schemes"]
features = ["portfolio", "blog", "tags", "responsive", "dark-mode", "color-palettes", "configurable-colors", "seo", "rss", "i18n", "multilingual", "no-js-dependencies", "accessibility"]

min_version = "0.158.0"

[author]
  name = "Adams Alves"
  homepage = "https://adamsalves.dev/"
